<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Inbox — CNC ERP</title>
<script src="shared/supabase-config.js"></script>
<script src="shared/core.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* Top bar */
.topbar { background:#075e54; color:white; padding:12px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
.topbar h1 { font-size:18px; font-weight:600; }
.topbar .subtitle { font-size:12px; opacity:0.8; margin-left:auto; }
.back-btn { color:white; text-decoration:none; font-size:13px; background:rgba(255,255,255,0.15); padding:6px 12px; border-radius:20px; }

/* Layout */
.app { display:flex; flex:1; overflow:hidden; }

/* Left sidebar */
.sidebar { width:360px; background:white; display:flex; flex-direction:column; border-right:1px solid #e9edef; flex-shrink:0; }
.search-box { padding:8px 12px; background:#f0f2f5; }
.search-box input { width:100%; padding:8px 14px; border:none; border-radius:20px; background:white; font-size:14px; outline:none; }
.conv-list { flex:1; overflow-y:auto; }
.conv-item { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; border-bottom:1px solid #f0f2f5; transition:background 0.1s; }
.conv-item:hover { background:#f5f6f6; }
.conv-item.active { background:#f0f2f5; }
.conv-avatar { width:48px; height:48px; border-radius:50%; background:#128c7e; display:flex; align-items:center; justify-content:center; color:white; font-size:18px; font-weight:600; flex-shrink:0; }
.conv-info { flex:1; min-width:0; }
.conv-name { font-size:15px; font-weight:500; color:#111b21; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-last { font-size:13px; color:#667781; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.conv-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.conv-time { font-size:11px; color:#667781; }
.conv-unread { background:#25d366; color:white; border-radius:50%; width:20px; height:20px; font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:600; }
.conv-unread.hidden { display:none; }

/* Empty sidebar */
.empty-conv { padding:40px 20px; text-align:center; color:#667781; font-size:14px; }

/* Right chat area */
.chat-area { flex:1; display:flex; flex-direction:column; background:#efeae2; }
.chat-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#667781; background:#f0f2f5; }
.chat-placeholder .icon { font-size:64px; margin-bottom:16px; }
.chat-placeholder h2 { font-size:22px; color:#41525d; margin-bottom:8px; }
.chat-placeholder p { font-size:14px; }

/* Chat header */
.chat-header { background:#f0f2f5; padding:10px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #e9edef; flex-shrink:0; }
.chat-header .avatar { width:40px; height:40px; border-radius:50%; background:#128c7e; display:flex; align-items:center; justify-content:center; color:white; font-size:16px; font-weight:600; }
.chat-header .info .name { font-size:15px; font-weight:600; color:#111b21; }
.chat-header .info .phone { font-size:12px; color:#667781; }

/* Messages */
.messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:4px; }
.msg { max-width:65%; padding:7px 12px 6px; border-radius:8px; font-size:14px; line-height:1.4; position:relative; }
.msg.in { background:white; border-radius:0 8px 8px 8px; align-self:flex-start; color:#111b21; }
.msg.out { background:#dcf8c6; border-radius:8px 0 8px 8px; align-self:flex-end; color:#111b21; }
.msg .time { font-size:11px; color:#667781; margin-top:3px; text-align:right; }
.msg.out .time::after { content:' ✓✓'; color:#53bdeb; }
.date-divider { text-align:center; margin:12px 0; }
.date-divider span { background:rgba(255,255,255,0.75); padding:4px 12px; border-radius:12px; font-size:12px; color:#54656f; }

/* Input area */
.input-area { background:#f0f2f5; padding:10px 16px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
.input-row { display:flex; align-items:flex-end; gap:8px; }
.input-area textarea { flex:1; padding:10px 14px; border:none; border-radius:24px; background:white; font-size:14px; font-family:inherit; resize:none; outline:none; max-height:120px; min-height:42px; line-height:1.4; }
.media-btn { width:42px; height:42px; border-radius:50%; background:white; border:none; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 0.2s; }
.media-btn:hover { background:#e9edef; }
.media-btn.recording { background:#ff4444; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.send-btn { width:46px; height:46px; border-radius:50%; background:#128c7e; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; flex-shrink:0; transition:background 0.2s; }
.send-btn:hover { background:#075e54; }
.send-btn:disabled { background:#b2bec3; cursor:not-allowed; }

/* Media preview */
.media-preview { background:white; border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:10px; }
.media-preview img { max-height:80px; border-radius:8px; }
.media-preview .media-info { flex:1; font-size:13px; color:#111b21; }
.media-preview .media-info small { color:#667781; }
.media-preview .remove-btn { background:none; border:none; cursor:pointer; font-size:18px; color:#667781; }
.media-preview audio { max-width:200px; height:36px; }

/* Message media */
.msg img { max-width:220px; border-radius:6px; display:block; margin-bottom:4px; cursor:pointer; }
.msg video { max-width:220px; border-radius:6px; display:block; margin-bottom:4px; }
.msg audio { max-width:220px; height:36px; display:block; margin-bottom:4px; }
.msg .doc-link { display:flex; align-items:center; gap:8px; text-decoration:none; color:#111b21; padding:4px 0; }
.msg .doc-link span { font-size:13px; }

/* Loading */
.loading { text-align:center; padding:20px; color:#667781; font-size:13px; }

/* Tabs */
.tabs { display:flex; background:#f0f2f5; border-bottom:1px solid #e9edef; flex-shrink:0; }
.tab-btn { flex:1; padding:12px; border:none; background:none; cursor:pointer; font-size:13px; font-family:inherit; color:#667781; border-bottom:2px solid transparent; transition:all 0.2s; }
.tab-btn.active { color:#128c7e; border-bottom-color:#128c7e; font-weight:600; }
.tab-btn:hover { background:#e9edef; }

/* Sent log */
.sent-log { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.log-filters { padding:10px 12px; background:#f0f2f5; display:flex; gap:8px; flex-shrink:0; }
.log-filters input, .log-filters select { padding:7px 12px; border:none; border-radius:16px; background:white; font-size:13px; font-family:inherit; outline:none; }
.log-filters input { flex:1; }
.log-table-wrap { flex:1; overflow-y:auto; }
.log-table { width:100%; border-collapse:collapse; font-size:13px; }
.log-table th { background:#f0f2f5; padding:10px 12px; text-align:left; font-weight:600; color:#667781; position:sticky; top:0; }
.log-table td { padding:9px 12px; border-bottom:1px solid #f0f2f5; color:#111b21; vertical-align:middle; }
.log-table tr:hover td { background:#f5f6f6; }
.status-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.status-sent    { background:#d4edda; color:#155724; }
.status-failed  { background:#f8d7da; color:#721c24; }
.status-no_wa   { background:#fff3cd; color:#856404; }
.status-skipped { background:#e9edef; color:#667781; }
.log-summary { padding:10px 16px; background:#f0f2f5; font-size:12px; color:#667781; border-top:1px solid #e9edef; flex-shrink:0; }

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#ccc; border-radius:3px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn">← Back</a>
  <h1>💬 WhatsApp Inbox</h1>
  <span class="subtitle">+92 321 6749443</span>
</div>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="tabs">
      <button class="tab-btn active" id="tabConv" onclick="switchTab('conv')">💬 Conversations</button>
      <button class="tab-btn" id="tabSent" onclick="switchTab('sent')">📤 Sent Log</button>
    </div>

    <!-- Conversations panel -->
    <div id="panelConv" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search conversations" oninput="filterConvs(this.value)">
      </div>
      <div class="conv-list" id="convList">
        <div class="loading">Loading conversations...</div>
      </div>
    </div>

    <!-- Sent Log panel -->
    <div id="panelSent" style="display:none;flex-direction:column;flex:1;overflow:hidden;" class="sent-log">
      <div class="log-filters">
        <input type="text" id="logSearch" placeholder="Search client or number..." oninput="filterLog()">
        <select id="logStatus" onchange="filterLog()">
          <option value="">All Status</option>
          <option value="sent">✓ Sent</option>
          <option value="failed">✗ Failed</option>
          <option value="no_wa">No WhatsApp</option>
          <option value="skipped">Skipped</option>
        </select>
      </div>
      <div class="log-table-wrap">
        <table class="log-table">
          <thead><tr>
            <th>Client</th>
            <th>Message</th>
            <th>Time</th>
            <th>Status</th>
          </tr></thead>
          <tbody id="logBody"><tr><td colspan="4" style="text-align:center;padding:24px;color:#667781">Loading...</td></tr></tbody>
        </table>
      </div>
      <div class="log-summary" id="logSummary"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="chat-placeholder">
      <div class="icon">💬</div>
      <h2>CNC ERP WhatsApp Inbox</h2>
      <p>Left se koi conversation select karo</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://knvaaxywlfpomlatpiua.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtudmFheHl3bGZwb21sYXRwaXVhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NzkzMjI4NSwiZXhwIjoyMDkzNTA4Mjg1fQ.vsCZIT5ER1DVBPvRGt8Ai-cYtUD0rosyxNEBi5T2NCo';
const SB_HDR = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
const SEND_FN = `${SUPABASE_URL}/functions/v1/whatsapp-send`;

let allConvs = [];
let activeConv = null;
let msgChannel = null;

// ── Fetch conversations ───────────────────────────────────────
async function loadConvs() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/wa_conversations?order=last_message_at.desc&limit=200`, { headers: SB_HDR });
  allConvs = await r.json();
  renderConvList(allConvs);
}

function renderConvList(convs) {
  const el = document.getElementById('convList');
  if (!convs.length) { el.innerHTML = '<div class="empty-conv">Koi conversation nahi<br><small>Jab clients reply karenge yahan dikhenge</small></div>'; return; }
  el.innerHTML = convs.map(c => `
    <div class="conv-item ${activeConv?.id === c.id ? 'active' : ''}" onclick="openConv('${c.id}')">
      <div class="conv-avatar">${(c.contact_name||c.phone)[0].toUpperCase()}</div>
      <div class="conv-info">
        <div class="conv-name">${esc(c.contact_name || c.phone)}</div>
        <div class="conv-last">${esc(c.last_message || '')}</div>
      </div>
      <div class="conv-meta">
        <div class="conv-time">${fmtTime(c.last_message_at)}</div>
        <div class="conv-unread ${!c.unread_count ? 'hidden' : ''}">${c.unread_count||''}</div>
      </div>
    </div>
  `).join('');
}

function filterConvs(q) {
  if (!q) return renderConvList(allConvs);
  const f = allConvs.filter(c => (c.contact_name||'').toLowerCase().includes(q.toLowerCase()) || c.phone.includes(q));
  renderConvList(f);
}

// ── Open conversation ─────────────────────────────────────────
async function openConv(id) {
  activeConv = allConvs.find(c => c.id === id);
  if (!activeConv) return;

  // Mark as read
  await fetch(`${SUPABASE_URL}/rest/v1/wa_conversations?id=eq.${id}`, {
    method: 'PATCH', headers: { ...SB_HDR, 'Content-Type': 'application/json' },
    body: JSON.stringify({ unread_count: 0 })
  });
  activeConv.unread_count = 0;
  renderConvList(allConvs);

  // Render chat
  document.getElementById('chatArea').innerHTML = `
    <div class="chat-header">
      <div class="avatar">${(activeConv.contact_name||activeConv.phone)[0].toUpperCase()}</div>
      <div class="info">
        <div class="name">${esc(activeConv.contact_name || activeConv.phone)}</div>
        <div class="phone">${activeConv.phone}</div>
      </div>
    </div>
    <div class="messages" id="msgList"><div class="loading">Loading...</div></div>
    <div class="input-area">
      <div id="mediaPreviewArea"></div>
      <div class="input-row">
        <button class="media-btn" id="attachBtn" title="Attach file" onclick="document.getElementById('fileInput').click()">📎</button>
        <button class="media-btn" id="voiceBtn" title="Record voice" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
        <textarea id="msgInput" placeholder="Type a message" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" onclick="sendMsg()" id="sendBtn">➤</button>
      </div>
      <input type="file" id="fileInput" style="display:none" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.txt" onchange="handleFileSelect(this)">
    </div>
  `;

  await loadMessages(id);
  subscribeMessages(id);
  document.getElementById('msgInput').focus();
}

async function loadMessages(convId) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/wa_messages?conversation_id=eq.${convId}&order=created_at.asc&limit=200`, { headers: SB_HDR });
  const msgs = await r.json();
  renderMessages(msgs);
}

function renderMessages(msgs) {
  const el = document.getElementById('msgList');
  if (!el) return;
  if (!msgs.length) { el.innerHTML = '<div class="loading">Koi message nahi abhi tak</div>'; return; }

  let html = '', lastDate = '';
  for (const m of msgs) {
    const d = new Date(m.created_at).toLocaleDateString('en-PK');
    if (d !== lastDate) {
      html += `<div class="date-divider"><span>${d}</span></div>`;
      lastDate = d;
    }
    const time = new Date(m.created_at).toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'});
    html += `<div class="msg ${m.direction}">${renderMsgBody(m)}<div class="time">${time}</div></div>`;
  }
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function renderMsgBody(m) {
  const body = m.body || '';
  const imgMatch  = body.match(/^\[image: (.+)\]$/);
  const vidMatch  = body.match(/^\[video: (.+)\]$/);
  const audMatch  = body.match(/^\[audio: (.+)\]$/);
  const docMatch  = body.match(/^\[document: (.+)\|(.+)\]$/);
  const tmplMatch = body.match(/^\[template: (.+)\]$/);
  if (imgMatch)  return `<img src="${imgMatch[1]}" alt="image" onclick="openImage('${imgMatch[1]}')">`;
  if (vidMatch)  return `<video src="${vidMatch[1]}" controls></video>`;
  if (audMatch)  return `<audio src="${audMatch[1]}" controls></audio>`;
  if (docMatch)  return `<a class="doc-link" href="${docMatch[2]}" target="_blank" rel="noopener"><span>📄</span><span>${esc(docMatch[1])}</span></a>`;
  if (tmplMatch) return `<span style="color:#667781;font-style:italic">📤 ${esc(tmplMatch[1])}</span>`;
  return esc(body);
}

// ── Realtime subscribe ────────────────────────────────────────
function subscribeMessages(convId) {
  if (msgChannel) { msgChannel.close(); }
  // Poll every 5 seconds for new messages
  msgChannel = setInterval(() => {
    if (activeConv?.id === convId) loadMessages(convId);
  }, 5000);
}

// ── Media state ───────────────────────────────────────────────
let pendingMedia = null; // { file, url, type, filename }
let mediaRecorder = null, audioChunks = [];

// ── File attach ───────────────────────────────────────────────
function handleFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  pendingMedia = { file, filename: file.name, type: getMediaType(file) };
  showMediaPreview();
}

function getMediaType(file) {
  if (file.type.startsWith('image/')) return 'image';
  if (file.type.startsWith('video/')) return 'video';
  if (file.type.startsWith('audio/')) return 'audio';
  return 'document';
}

function showMediaPreview() {
  const area = document.getElementById('mediaPreviewArea');
  if (!area || !pendingMedia) return;
  const { file, filename, type } = pendingMedia;
  const objUrl = URL.createObjectURL(file);
  let preview = '';
  if (type === 'image') preview = `<img src="${objUrl}">`;
  else if (type === 'audio') preview = `<audio src="${objUrl}" controls></audio>`;
  else preview = `<span>📄 ${esc(filename)}</span>`;
  area.innerHTML = `
    <div class="media-preview">
      ${preview}
      <div class="media-info"><div>${esc(filename)}</div><small>${(file.size/1024).toFixed(0)} KB · ${type}</small></div>
      <button class="remove-btn" onclick="clearMedia()">✕</button>
    </div>`;
}

function clearMedia() {
  pendingMedia = null;
  const area = document.getElementById('mediaPreviewArea');
  if (area) area.innerHTML = '';
}

// ── Voice recording ───────────────────────────────────────────
async function startRecording() {
  if (mediaRecorder) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
      const file = new File([blob], `voice-${Date.now()}.ogg`, { type: 'audio/ogg' });
      pendingMedia = { file, filename: file.name, type: 'audio' };
      showMediaPreview();
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    const btn = document.getElementById('voiceBtn');
    if (btn) { btn.classList.add('recording'); btn.textContent = '⏹'; }
  } catch (e) {
    alert('Microphone access denied: ' + e.message);
  }
}

function stopRecording() {
  if (!mediaRecorder) return;
  mediaRecorder.stop();
  mediaRecorder = null;
  const btn = document.getElementById('voiceBtn');
  if (btn) { btn.classList.remove('recording'); btn.textContent = '🎤'; }
}

// ── Upload to Supabase Storage ────────────────────────────────
async function uploadMedia(file, type) {
  const ext = file.name.split('.').pop();
  const path = `${type}/${Date.now()}.${ext}`;
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/wa-media/${path}`, {
    method: 'POST',
    headers: { ...SB_HDR, 'Content-Type': file.type, 'x-upsert': 'true' },
    body: file
  });
  if (!r.ok) { const e = await r.text(); throw new Error('Upload failed: ' + e); }
  return `${SUPABASE_URL}/storage/v1/object/public/wa-media/${path}`;
}

// ── Send message ──────────────────────────────────────────────
async function sendMsg() {
  const input = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');
  const msg = input.value.trim();
  if (!msg && !pendingMedia || !activeConv) return;

  input.value = '';
  input.style.height = '';
  btn.disabled = true;

  try {
    if (pendingMedia) {
      const { file, type, filename } = pendingMedia;
      clearMedia();
      const mediaUrl = await uploadMedia(file, type);
      // Store body as parseable marker for renderMsgBody
      let msgBody;
      if (type === 'document') msgBody = `[document: ${filename}|${mediaUrl}]`;
      else msgBody = `[${type}: ${mediaUrl}]`;

      const r = await fetch(SEND_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activeConv.phone, message: msgBody, conversation_id: activeConv.id, media_url: mediaUrl, media_type: type, filename })
      });
      const data = await r.json();
      if (!r.ok) alert('Send fail: ' + (data.error || 'Unknown'));
    } else {
      const r = await fetch(SEND_FN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: activeConv.phone, message: msg, conversation_id: activeConv.id })
      });
      const data = await r.json();
      if (!r.ok) { alert('Send fail: ' + (data.error || 'Unknown error')); input.value = msg; }
    }
    await loadMessages(activeConv.id);
    await loadConvs();
  } catch (e) {
    alert('Error: ' + e.message);
    if (msg) input.value = msg;
  }
  btn.disabled = false;
  input.focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Helpers ───────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'});
  const diff = Math.floor((now-d)/86400000);
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return d.toLocaleDateString('en-PK',{weekday:'short'});
  return d.toLocaleDateString('en-PK',{day:'2-digit',month:'2-digit'});
}

// ── Tab switching ─────────────────────────────────────────────
let activeTab = 'conv';
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabConv').classList.toggle('active', tab === 'conv');
  document.getElementById('tabSent').classList.toggle('active', tab === 'sent');
  document.getElementById('panelConv').style.display = tab === 'conv' ? 'flex' : 'none';
  document.getElementById('panelSent').style.display = tab === 'sent' ? 'flex' : 'none';
  if (tab === 'sent') loadLog();
}

// ── Sent Log ──────────────────────────────────────────────────
let allLog = [];

async function loadLog() {
  const tbody = document.getElementById('logBody');
  tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:#667781">Loading...</td></tr>';
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/wa_broadcast_log?order=sent_at.desc&limit=2000`, { headers: SB_HDR });
    allLog = await r.json();
    if (!Array.isArray(allLog)) allLog = [];
    renderLog(allLog);
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;color:#dc3545">Error: ${esc(e.message)}</td></tr>`;
  }
}

function filterLog() {
  const q = (document.getElementById('logSearch').value || '').toLowerCase();
  const s = document.getElementById('logStatus').value;
  const filtered = allLog.filter(r =>
    (!q || (r.contact_name||'').toLowerCase().includes(q) || (r.phone||'').includes(q) || (r.label||'').toLowerCase().includes(q)) &&
    (!s || r.status === s)
  );
  renderLog(filtered);
}

function renderLog(rows) {
  const tbody = document.getElementById('logBody');
  const summary = document.getElementById('logSummary');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:#667781">Koi record nahi</td></tr>';
    summary.textContent = '';
    return;
  }

  const counts = { sent: 0, failed: 0, no_wa: 0, skipped: 0 };
  rows.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td><div style="font-weight:500">${esc(r.contact_name || '—')}</div><div style="font-size:11px;color:#667781">${esc(r.phone)}</div></td>
      <td style="max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(r.label||'')}">
        <div>${esc(r.label || r.template || '—')}</div>
        <div style="font-size:11px;color:#667781">${esc(r.template||'')}</div>
      </td>
      <td style="white-space:nowrap;font-size:12px">${fmtDateTime(r.sent_at)}</td>
      <td><span class="status-badge status-${r.status}">${statusLabel(r.status)}</span></td>
    </tr>
  `).join('');

  summary.textContent = `Total: ${rows.length} — ✓ Sent: ${counts.sent} · ✗ Failed: ${counts.failed} · No WA: ${counts.no_wa} · Skipped: ${counts.skipped}`;
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-PK', { day:'2-digit', month:'short' }) + ' ' +
         d.toLocaleTimeString('en-PK', { hour:'2-digit', minute:'2-digit' });
}

function statusLabel(s) {
  return s === 'sent' ? '✓ Sent' : s === 'failed' ? '✗ Failed' : s === 'no_wa' ? 'No WA' : 'Skipped';
}

// ── Init ──────────────────────────────────────────────────────
loadConvs();
setInterval(loadConvs, 15000); // refresh conv list every 15 sec
</script>
