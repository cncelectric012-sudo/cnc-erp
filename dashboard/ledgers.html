<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Ledgers · CNC Electric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
/* ══════════════════════════════════════════════
   LEDGER CARDS — Professional Layout
══════════════════════════════════════════════ */
.client-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}

/* Card */
.client-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  position: relative;
}
.client-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(0,0,0,.10);
  border-color: var(--brand);
}

/* Left accent stripe */
.client-card-bar {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  border-radius: 14px 0 0 14px;
}
.client-card-bar.green  { background: var(--green); }
.client-card-bar.yellow { background: #F59E0B; }
.client-card-bar.red    { background: var(--red); }

.client-card-body { padding: 16px 16px 14px 20px; }

/* Header row: name + balance */
.client-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.client-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  word-break: break-word;
  flex: 1;
}
.client-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }

/* Outstanding amount block */
.client-bal-block { text-align: right; flex-shrink: 0; }
.client-bal-num {
  font-size: 20px;
  font-weight: 800;
  font-family: var(--font-mono);
  line-height: 1;
}
.client-bal-label {
  font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-top: 3px;
}

/* Contact row */
.client-contact-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 12px;
  color: var(--text-3);
  padding: 8px 0;
  border-top: 1px solid var(--border);
  margin-bottom: 10px;
}
.client-contact-item { display: flex; align-items: center; gap: 4px; }

/* Stats row */
.client-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}
.client-stat {
  background: var(--surface-2);
  padding: 7px 8px;
  border-radius: 8px;
  text-align: center;
}
.client-stat-label {
  font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 3px;
}
.client-stat-value {
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font-mono);
}

/* Progress bar */
.client-bar-wrap {
  height: 3px;
  background: var(--surface-2);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 11px;
}
.client-bar-fill { height: 100%; border-radius: 99px; }

/* Footer */
.client-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
  padding-top: 10px;
  font-size: 11px;
  color: var(--text-3);
}

/* Branch badge colors */
.badge-cnc  { background:#FEF2F2; color:#DC2626; border:1px solid #FECACA; }
.badge-cst  { background:#EFF6FF; color:#2563EB; border:1px solid #BFDBFE; }
.badge-cspl { background:#F0FDF4; color:#16A34A; border:1px solid #BBF7D0; }

/* ── Export Bar ── */
.export-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn-export { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; transition:all .15s; }
.btn-export:hover { background:var(--surface-2); border-color:var(--border-2); }

/* ── Toolbar ── */
.toolbar-grid { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; }
.toolbar-search { flex:1; min-width:200px; }

/* ── Sort buttons ── */
.sort-btn { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text-3); font-size:11px; font-weight:500; cursor:pointer; transition:all .15s; }
.sort-btn:hover { background:var(--surface-2); }
.sort-btn.active { background:linear-gradient(135deg,#DC2626,#7C3AED); border-color:transparent; color:#fff; font-weight:600; }

/* ── Count bar ── */
#ledgerCount { font-size:12px; color:var(--text-3); margin-bottom:12px; padding:0 2px; }

/* ══════════════════════════════════════════════
   MODAL styles
══════════════════════════════════════════════ */
.modal-client-name { font-size:22px; font-weight:700; margin-bottom:6px; }
.modal-tags { display:flex; flex-wrap:wrap; gap:6px; }
.detail-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
.detail-kpi { background:var(--surface-2); border-radius:10px; padding:14px 12px; text-align:center; }
.detail-kpi-num { font-size:18px; font-weight:700; font-family:var(--font-mono); margin-bottom:3px; }
.detail-kpi-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; }
.contact-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; background:var(--surface-2); border-radius:10px; padding:16px; margin-bottom:20px; }
.contact-field-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
.contact-field-value { font-size:13px; font-weight:500; word-break:break-word; }
.txn-table-wrap { border:1px solid var(--border); border-radius:10px; overflow:hidden; max-height:400px; overflow-y:auto; }
.txn-table { width:100%; border-collapse:collapse; }
.txn-table th { background:var(--surface-2); padding:9px 14px; font-size:10px; text-align:left; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; }
.txn-table td { padding:9px 14px; font-size:12px; border-bottom:1px solid var(--border); font-family:var(--font-mono); white-space:nowrap; }
.txn-table tr:last-child td { border-bottom:none; }
.txn-table tbody tr:hover { background:var(--surface-2); }
.txn-row-payment { background:rgba(16,185,129,.04); }
.tag { display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:5px; font-size:10px; font-weight:600; }
.tag-invoice { background:var(--blue-50); color:var(--blue); }
.tag-payment { background:var(--green-50); color:var(--green); }
.modal-tabs { display:flex; gap:2px; background:var(--surface-2); border-radius:8px; padding:3px; margin-bottom:14px; border:1px solid var(--border); }
.modal-tab-btn { flex:1; padding:7px 10px; border-radius:6px; border:none; background:transparent; cursor:pointer; font-size:12px; font-weight:500; color:var(--text-3); white-space:nowrap; transition:all .15s; }
.modal-tab-btn.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-xs); font-weight:600; }

/* Timeline */
.timeline-item { display:flex; gap:12px; margin-bottom:8px; align-items:flex-start; }
.timeline-dot { flex-shrink:0; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:14px; }
.timeline-card { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; }

/* Loading */
.loading-state { text-align:center; padding:80px 20px; color:var(--text-3); }
.loading-spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--brand,#DC2626); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body data-page="ledgers">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar-title">Client Ledgers</div>
        <div class="topbar-sub" id="topbarSub">Loading from Supabase...</div>
      </div>
      <div class="topbar-actions export-bar">
        <button class="btn-export" onclick="exportCSV()">⬇ CSV</button>
        <button class="btn-export" onclick="exportExcel()">⬇ Excel</button>
        <button class="btn-export" onclick="exportPDF()">⬇ PDF</button>
        <button class="btn-export" onclick="exportImage()">⬇ Image</button>
      </div>
    </div>

    <div class="content">

      <!-- KPI Row -->
      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">Clients</div><div class="kpi-value" id="kv-clients">—</div></div>
        <div class="kpi-card red"><div class="kpi-label">Outstanding</div><div class="kpi-value" id="kv-outstanding">—</div></div>
        <div class="kpi-card blue"><div class="kpi-label">Total Sales</div><div class="kpi-value" id="kv-sales">—</div></div>
        <div class="kpi-card green"><div class="kpi-label">Collected</div><div class="kpi-value" id="kv-paid">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Pending</div><div class="kpi-value" id="kv-pending">—</div></div>
      </div>

      <!-- Filter Bar -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px">
        <!-- Search row -->
        <input class="search-input" id="s-name" placeholder="🔍  Search client name, phone, city..." oninput="applyFilters()" style="width:100%;margin-bottom:8px"/>
        <!-- Filters row — no wrap -->
        <div style="display:flex;gap:8px;align-items:center;overflow-x:auto;white-space:nowrap;padding-bottom:2px">
          <select class="select" id="s-branch" onchange="applyFilters()" style="min-width:130px;flex-shrink:0">
            <option value="">All Branches</option>
            <option value="cnc">CNC</option>
            <option value="cst">CS Traders</option>
            <option value="cspl">Cog. Solutions</option>
          </select>
          <select class="select" id="s-salesperson" onchange="applyFilters()" style="min-width:130px;flex-shrink:0">
            <option value="">All Sales Reps</option>
          </select>
          <select class="select" id="s-type" onchange="applyFilters()" style="min-width:110px;flex-shrink:0">
            <option value="">Dr / Cr: All</option>
            <option value="Dr">Dr (Owe Us)</option>
            <option value="Cr">Cr (We Owe)</option>
          </select>
          <select class="select" id="s-risk" onchange="applyFilters()" style="min-width:110px;flex-shrink:0">
            <option value="">Risk: All</option>
            <option value="Low">🟢 Low</option>
            <option value="Medium">🟡 Medium</option>
            <option value="High">🔴 High</option>
          </select>
          <div style="flex:1"></div>
          <span id="ledgerCount" style="font-size:11px;color:var(--text-3);white-space:nowrap;flex-shrink:0"></span>
          <button class="sort-btn active" id="sort-outstanding" onclick="setSort('outstanding')" style="flex-shrink:0">↓ Outstanding</button>
          <button class="sort-btn" id="sort-name" onclick="setSort('name')" style="flex-shrink:0">Name</button>
          <button class="sort-btn" id="sort-risk" onclick="setSort('risk')" style="flex-shrink:0">Risk</button>
        </div>
      </div>
      <!-- hidden selects kept for applyFilters compatibility -->
      <select id="s-outstanding" style="display:none"><option value=""></option></select>
      <select id="s-city" style="display:none"><option value=""></option></select>

      <!-- Table View -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden">
        <div style="overflow-x:auto">
          <table id="ledgerTable" style="width:100%;border-collapse:collapse">
            <thead>
              <tr style="background:var(--surface-2);border-bottom:2px solid var(--border)">
                <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">#</th>
                <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Client Name</th>
                <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Branch</th>
                <th style="padding:10px 14px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Outstanding</th>
                <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Type</th>
                <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Risk</th>
                <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Invoices</th>
                <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Payments</th>
                <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Phone</th>
                <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">City</th>
                <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap">Actions</th>
              </tr>
            </thead>
            <tbody id="ledgerGrid">
              <tr><td colspan="11" style="padding:60px;text-align:center;color:var(--text-3)">
                <div class="loading-spinner" style="margin:0 auto 12px"></div>
                <div id="loadMsg">Loading clients from Supabase...</div>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Detail Modal -->
<div class="modal-overlay hidden" id="clientModal">
  <div class="modal-box" style="max-width:900px">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Client Ledger</div>
        <div class="modal-client-name" id="m-name">—</div>
        <div class="modal-tags" id="m-badges"></div>
      </div>
      <div style="display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap">
        <button class="btn-export" onclick="exportClientPDF()" style="font-size:11px;padding:5px 10px">🖨️ Print</button>
        <button class="btn-export" onclick="exportClientCSV()" style="font-size:11px;padding:5px 10px">⬇ CSV</button>
        <button class="btn-export" id="m-wa-btn" style="font-size:11px;padding:5px 10px;background:var(--green-50);border-color:var(--green-100);color:var(--green)">💬 WhatsApp</button>
        <button class="btn-export" id="m-edit-btn" style="font-size:11px;padding:5px 10px;background:var(--blue-50);border-color:var(--blue-100);color:var(--blue)">✏️ Edit</button>
        <button class="btn-export" id="m-del-btn" style="font-size:11px;padding:5px 10px;background:var(--red-50);border-color:var(--red-100);color:var(--red)">🗑 Delete</button>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-body">

      <!-- Contact Info -->
      <div class="contact-grid" id="m-contact"></div>

      <!-- KPIs -->
      <div class="detail-kpi-row" id="m-kpis"></div>

      <!-- Tabs -->
      <div class="modal-tabs">
        <button class="modal-tab-btn active" onclick="switchTab('all')">All Transactions</button>
        <button class="modal-tab-btn" onclick="switchTab('invoices')">Invoices</button>
        <button class="modal-tab-btn" onclick="switchTab('payments')">Payments</button>
        <button class="modal-tab-btn" onclick="switchTab('aging')">📅 Aging</button>
        <button class="modal-tab-btn" onclick="switchTab('timeline')">Timeline</button>
      </div>

      <div id="m-txn-wrap">
        <div class="txn-table-wrap">
          <table class="txn-table">
            <thead>
              <tr>
                <th>#</th><th>Date</th><th>Type</th><th>Voucher</th>
                <th style="text-align:right">Debit</th><th style="text-align:right">Credit</th><th style="text-align:right">Balance</th>
              </tr>
            </thead>
            <tbody id="m-txn-body"></tbody>
          </table>
        </div>
      </div>
      <div id="m-aging" style="display:none"></div>
      <div id="m-timeline" style="display:none"></div>
    </div>
  </div>
</div>

<script src="shared/auth-guard.js"></script>

<script>
// ── State ──────────────────────────────────────────────────────
let allClients = [];      // raw from Supabase
let filtered   = [];      // after filters
let currentSort = 'outstanding';
let currentClient = null; // for modal
let currentTab = 'all';

// num, fmt, fmtK already defined in core.js

const LAPI = 'https://knvaaxywlfpomlatpiua.supabase.co/rest/v1';
const LKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtudmFheHl3bGZwb21sYXRwaXVhIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NzkzMjI4NSwiZXhwIjoyMDkzNTA4Mjg1fQ.vsCZIT5ER1DVBPvRGt8Ai-cYtUD0rosyxNEBi5T2NCo';
const LHDR = { 'apikey': LKEY, 'Authorization': 'Bearer ' + LKEY };

async function lFetch(params) {
  const r = await fetch(`${LAPI}/clients?${params}`, { headers: LHDR });
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
  return r.json();
}

// ── Load from ledgers view ────────────────────────────────────
async function loadClients() {
  const sub  = document.getElementById('topbarSub');
  const grid = document.getElementById('ledgerGrid');

  // Step 1: update UI immediately
  sub.textContent  = 'Loading...';
  grid.innerHTML   = '<div class="loading-state" style="grid-column:1/-1"><div class="loading-spinner"></div><div id="loadMsg">Fetching data...</div></div>';

  const setMsg = t => { const el=document.getElementById('loadMsg'); if(el) el.textContent=t; };

  try {
    setMsg('Connecting to Supabase...');
    let all = [], from = 0;

    while (true) {
      const url = `${LAPI}/ledgers?limit=500&offset=${from}&order=outstanding_amount.desc`;
      setMsg(`Fetching rows ${from}–${from+500}...`);
      const r = await fetch(url, { headers: LHDR });
      if (!r.ok) {
        const txt = await r.text();
        throw new Error(`HTTP ${r.status} — ${txt.slice(0,200)}`);
      }
      const batch = await r.json();
      if (!Array.isArray(batch)) {
        throw new Error(`Expected array, got: ${JSON.stringify(batch).slice(0,200)}`);
      }
      if (!batch.length) break;
      all = all.concat(batch);
      setMsg(`Loaded ${all.length} clients...`);
      if (batch.length < 500) break;
      from += 500;
    }

    setMsg(`Rendering ${all.length} clients...`);
    allClients = all;
    sub.textContent = `${allClients.length} clients`;

    // Step 2: populate dropdowns safely
    try { populateDropdowns(); } catch(e) { console.warn('populateDropdowns error:', e); }

    // Step 3: render directly — bypass applyFilters for first render
    filtered = allClients;
    updateKPIs();
    renderGrid();

    sub.textContent = `${allClients.length} ledger clients loaded`;

    // Step 4: hook up live filtering
    document.getElementById('s-name')?.addEventListener('input', applyFilters);

  } catch (err) {
    sub.textContent = '⚠️ ' + err.message;
    grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;text-align:center;color:red;font-size:13px;word-break:break-all">
      <b>⚠️ Error:</b><br><br>${err.message}
    </div>`;
  }
}

// ── Populate dropdowns ─────────────────────────────────────────
function populateDropdowns() {
  const sps = [...new Set(allClients.map(c=>c.salesperson).filter(Boolean))].sort();
  const spSel = document.getElementById('s-salesperson');
  if (spSel) spSel.innerHTML = '<option value="">All Sales Reps</option>' +
    sps.map(s=>`<option value="${s}">${s}</option>`).join('');
}

// ── Apply Filters + Sort ───────────────────────────────────────
function applyFilters() {
  const search = (document.getElementById('s-name')?.value||'').toLowerCase();
  const risk   = document.getElementById('s-risk')?.value||'';
  const sp     = document.getElementById('s-salesperson')?.value||'';
  const type   = document.getElementById('s-type')?.value||'';
  const branch = document.getElementById('s-branch')?.value||'';

  filtered = allClients.filter(c => {
    if (search) {
      const h = [c.name,c.phone,c.address,c.city,c.salesperson].join(' ').toLowerCase();
      if (!h.includes(search)) return false;
    }
    if (risk   && c.risk_level !== risk) return false;
    if (type   && c.outstanding_type !== type) return false;
    if (sp     && c.salesperson !== sp) return false;
    if (branch) {
      const id = (c.id||'').toLowerCase();
      if (branch==='cnc'  && !id.includes('_cnc'))  return false;
      if (branch==='cst'  && !id.includes('_cst'))  return false;
      if (branch==='cspl' && !id.includes('_cspl')) return false;
    }
    return true;
  });

  // Sort
  if (currentSort === 'outstanding') filtered.sort((a,b)=>num(b.outstanding_amount)-num(a.outstanding_amount));
  else if (currentSort === 'sales')  filtered.sort((a,b)=>num(b.totalInvoiced)-num(a.totalInvoiced));
  else if (currentSort === 'name')   filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if (currentSort === 'risk')   {
    const rl = {High:3,Medium:2,Low:1};
    filtered.sort((a,b)=>(rl[b.risk_level]||0)-(rl[a.risk_level]||0));
  }

  updateKPIs();
  renderGrid();
}

function setSort(key) {
  currentSort = key;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById('sort-'+key);
  if (el) el.classList.add('active');
  applyFilters();
}

// ── Update KPIs ────────────────────────────────────────────────
function updateKPIs() {
  const totalOS    = filtered.reduce((s,c)=>s+num(c.outstanding_amount),0);
  const totalSales = filtered.reduce((s,c)=>s+num(c.total_invoiced),0);
  const totalPaid  = filtered.reduce((s,c)=>s+num(c.total_paid),0);
  const totalPend  = filtered.reduce((s,c)=>s+(c.outstanding_type==='Dr'?num(c.outstanding_amount):0),0);

  document.getElementById('kv-clients').textContent     = filtered.length;
  document.getElementById('kv-outstanding').textContent = 'PKR '+fmtK(totalOS);
  document.getElementById('kv-sales').textContent       = 'PKR '+fmtK(totalSales);
  document.getElementById('kv-paid').textContent        = 'PKR '+fmtK(totalPaid);
  document.getElementById('kv-pending').textContent     = 'PKR '+fmtK(totalPend);
}

// Branch from ID
function getBranch(id) {
  const s = (id||'').toLowerCase();
  if (s.includes('_cnc_ledger')||s.endsWith('_cnc'))  return {label:'CNC',cls:'badge-cnc'};
  if (s.includes('_cst_ledger')||s.endsWith('_cst'))  return {label:'CS Traders',cls:'badge-cst'};
  if (s.includes('_cspl_ledger')||s.endsWith('_cspl'))return {label:'Cog. Solutions',cls:'badge-cspl'};
  return null;
}

async function saveLedgerEdit(id) {
  const fields = ['name','city','phone','address','contact_person','email','salesperson','outstanding_amount','risk_level','avg_payment_days'];
  const update = {};
  fields.forEach(k => {
    const el = document.getElementById('le-'+k);
    if(el) update[k] = k==='outstanding_amount' ? parseFloat(el.value)||0 : el.value.trim();
  });
  update.last_updated = new Date().toISOString();

  const r = await fetch(`${LAPI}/clients?id=eq.${id}`, {
    method:'PATCH', headers:{...LHDR,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify(update)
  });
  if(r.ok) {
    showToast('Ledger updated','✅');
    document.getElementById('ledger-edit-panel').remove();
    closeModal();
    await loadClients();
  } else {
    showToast('Save failed','❌');
  }
}

async function deleteLedgerClient(id, name) {
  if(!confirm(`"${name}" ka ledger delete karo? Saari transactions bhi hat jaayengi.`)) return;
  const r = await fetch(`${LAPI}/clients?id=eq.${id}`, { method:'DELETE', headers:LHDR });
  if(r.ok) {
    showToast(`${name} deleted`,'🗑️');
    closeModal();
    await loadClients();
  } else {
    showToast('Delete failed','❌');
  }
}

function switchTab(tab) {
  currentTab = tab;
  const tabs = ['all','invoices','payments','aging','timeline'];
  document.querySelectorAll('.modal-tab-btn').forEach((b,i)=>b.classList.toggle('active',tabs[i]===tab));
  document.getElementById('m-txn-wrap').style.display = 'none';
  document.getElementById('m-timeline').style.display  = 'none';
  document.getElementById('m-aging').style.display     = 'none';
  if(tab==='timeline'){ document.getElementById('m-timeline').style.display='block'; renderTimeline(currentClient); }
  else if(tab==='aging'){ document.getElementById('m-aging').style.display='block'; renderAging(currentClient); }
  else { document.getElementById('m-txn-wrap').style.display='block'; renderTxnTable(currentClient,tab); }
}

// ── Aging Analysis ─────────────────────────────────────────────
function renderAging(c) {
  const today = new Date();
  const txns = (c.transactions||[]).filter(t=>t.type==='Invoice');
  const buckets = [{lbl:'0-30 days',min:0,max:30,color:'var(--green)',items:[]},{lbl:'31-60 days',min:31,max:60,color:'var(--yellow)',items:[]},{lbl:'61-90 days',min:61,max:90,color:'var(--orange)',items:[]},{lbl:'90+ days',min:91,max:9999,color:'var(--red)',items:[]}];

  txns.forEach(t=>{
    const d = sortDate(t.date);
    if(!d) return;
    const days = Math.floor((today - d)/86400000);
    const b = buckets.find(x=>days>=x.min&&days<=x.max);
    if(b) b.items.push({...t, days});
  });

  const total = buckets.reduce((s,b)=>s+b.items.reduce((ss,t)=>ss+num(t.amount),0),0);

  const el = document.getElementById('m-aging');
  el.innerHTML = `
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
    ${buckets.map(b=>{
      const amt = b.items.reduce((s,t)=>s+num(t.amount),0);
      const pct = total>0?Math.round(amt/total*100):0;
      return `<div style="background:var(--surface-2);border-radius:8px;padding:12px;text-align:center;border-top:3px solid ${b.color}">
        <div style="font-size:18px;font-weight:800;color:${b.color}">PKR ${fmtK(amt)}</div>
        <div style="font-size:10px;color:var(--text-3);margin-top:3px;text-transform:uppercase">${b.lbl}</div>
        <div style="font-size:11px;font-weight:600;margin-top:4px">${b.items.length} invoices · ${pct}%</div>
      </div>`;
    }).join('')}
  </div>
  ${buckets.filter(b=>b.items.length>0).map(b=>`
  <div style="margin-bottom:12px">
    <div style="font-weight:600;font-size:12px;color:${b.color};margin-bottom:6px">📅 ${b.lbl} (${b.items.length})</div>
    <div class="txn-table-wrap" style="max-height:150px">
      <table class="txn-table"><thead><tr><th>Date</th><th>Voucher</th><th style="text-align:right">Amount</th><th style="text-align:right">Days</th></tr></thead>
      <tbody>${b.items.map(t=>`<tr><td>${t.date||'—'}</td><td>${t.voucher||'—'}</td><td style="text-align:right">PKR ${fmt(num(t.amount))}</td><td style="text-align:right;color:${b.color};font-weight:600">${t.days}d</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`).join('')}
  ${!txns.length?'<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">No invoice transactions for aging analysis</div></div>':''}`;
}

function renderTxnTable(c, filter) {
  let txns = (c.transactions||[]).slice().sort((a,b)=>sortDate(a.date)-sortDate(b.date));
  if (filter==='invoices') txns = txns.filter(t=>t.type==='Invoice');
  if (filter==='payments') txns = txns.filter(t=>t.type==='Payment'||t.type==='Receipt');

  // Compute running balance
  let bal = 0;
  const rows = txns.map((t,i) => {
    const amt  = num(t.amount);
    const isInv = t.type==='Invoice';
    const isPay = t.type==='Payment'||t.type==='Receipt';
    if (isInv) bal += amt;
    if (isPay) bal -= amt;
    const balDisplay = bal;
    return `
    <tr class="${isPay?'txn-row-payment':''}">
      <td style="color:var(--text-3)">${i+1}</td>
      <td>${t.date||'—'}</td>
      <td><span class="tag ${isPay?'tag-payment':'tag-invoice'}">${isPay?'💰 Payment':'📄 Invoice'}</span></td>
      <td style="font-weight:600">${t.voucher||'—'}</td>
      <td style="text-align:right">${isInv?'PKR '+fmt(amt):'—'}</td>
      <td style="text-align:right;color:var(--green)">${isPay?'PKR '+fmt(amt):'—'}</td>
      <td style="text-align:right;font-weight:600;color:${balDisplay>0?'var(--red)':'var(--green)'}">${balDisplay>0?'PKR '+fmt(balDisplay):balDisplay<0?'-PKR '+fmt(Math.abs(balDisplay)):'0'}</td>
    </tr>`;
  });

  document.getElementById('m-txn-body').innerHTML = rows.join('') ||
    '<tr><td colspan="7" style="text-align:center;color:var(--text-3);padding:20px">No transactions</td></tr>';
}

function sortDate(s) {
  if (!s) return 0;
  const parts = String(s).split(/[\/-]/);
  if (parts.length===3 && parts[2].length===4) return new Date(+parts[2],+parts[1]-1,+parts[0]).getTime();
  return new Date(s).getTime()||0;
}

function renderTimeline(c) {
  const txns = (c.transactions||[]).slice().sort((a,b)=>sortDate(a.date)-sortDate(b.date));
  if (!txns.length) {
    document.getElementById('m-timeline').innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No transactions</div></div>';
    return;
  }
  document.getElementById('m-timeline').innerHTML = txns.map(t=>{
    const isPay = t.type==='Payment'||t.type==='Receipt';
    const amt = num(t.amount);
    const color = isPay?'var(--green)':'var(--blue)';
    const bg    = isPay?'rgba(16,185,129,.1)':'rgba(59,130,246,.1)';
    const icon  = isPay?'💰':'📄';
    const label = isPay?`PKR ${fmt(amt)} received`:`PKR ${fmt(amt)} invoiced`;
    return `
    <div class="timeline-item">
      <div class="timeline-dot" style="background:${bg}">${icon}</div>
      <div class="timeline-card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-weight:600;font-size:13px;color:${color}">${label}</span>
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-3)">${t.date||''}</span>
        </div>
        <div style="font-size:11px;color:var(--text-3);margin-top:3px">${t.voucher||''} ${t.description?'· '+t.description:''}</div>
      </div>
    </div>`;
  }).join('');
}

    rows.push({
      'Client Name':    c.name||'',

      'Address':        c.address||'',
      'City':           c.city||'',
      'Contact Person': c.contact_person||'',
      'Sales Person':   c.salesperson||'',
      'Outstanding (PKR)': os,
      'Balance Type':   c.outstanding_type||'',
      'Total Invoiced': inv,
      'Total Paid':     paid,
      'Recovery %':     rec,
      'Risk Level':     c.risk_level||'',
      'Avg Payment Days': c.avg_payment_days||'',
      'Transactions':   (c.transactions||[]).length,
      'Last Updated':   c.last_updated||''
    });
  }
  return rows;
}

function exportCSV() {
  const rows = buildExportRows(filtered);
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(','),
    ...rows.map(r=>headers.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))
  ].join('\n');
  downloadFile('cnc_ledgers.csv','text/csv;charset=utf-8;',csv);
  showToast('CSV exported','⬇');
}

function exportExcel() {
  const rows = buildExportRows(filtered);
  if (!rows.length) return;
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,'Ledgers',ws);

  // Auto column width
  const cols = Object.keys(rows[0]).map(k=>({ wch: Math.max(k.length, 14) }));
  ws['!cols'] = cols;

  XLSX.writeFile(wb,'cnc_ledgers.xlsx');
  showToast('Excel exported','⬇');
}

function exportPDF() {
  window.print();
}

function exportImage() {
  const grid = document.getElementById('ledgerGrid');
  html2canvas(grid,{scale:1.5,backgroundColor:'#ffffff'}).then(canvas=>{
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'cnc_ledgers.png';
    a.click();
    showToast('Image exported','⬇');
  });
}

function exportClientCSV() {
  const c = currentClient;
  if (!c) return;
  const txns = (c.transactions||[]).map(t=>({
    'Date':t.date||'','Type':t.type||'','Voucher':t.voucher||'',
    'Amount (PKR)':num(t.amount),'Description':t.description||''
  }));
  const headers = ['Date','Type','Voucher','Amount (PKR)','Description'];
  const csv = [headers.join(','),
    ...txns.map(r=>headers.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))
  ].join('\n');
  downloadFile(`${c.name}_ledger.csv`,'text/csv;charset=utf-8;',csv);
  showToast('Client CSV exported','⬇');
}

function downloadFile(name, type, content) {
  const blob = new Blob([content],{type});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

// ── Toast ──────────────────────────────────────────────────────
function showToast(msg, icon='✓') {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div'); t.id='toast'; t.className='toast';
    t.innerHTML='<span id="toastIcon"></span><span id="toastMsg"></span>';
    document.body.appendChild(t);
  }
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = icon;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ── Init ───────────────────────────────────────────────────────
document.addEventListener('click', e => {
  if (e.target.id==='clientModal') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeModal();
});

// Guaranteed load — fires after everything is ready
window.addEventListener('load', () => {
  try { renderSidebar('ledgers'); } catch(e) {}
  setTimeout(loadClients, 300);
});

document.addEventListener('DOMContentLoaded', () => {
  try { renderSidebar('ledgers'); } catch(e) {}

  // Auto-open if URL has ?open=
  const p = new URLSearchParams(window.location.search);
  if (p.has('open')) setTimeout(()=>{
    const c = allClients.find(x=>x.name===p.get('open'));
    if (c) openModal(c.id);
  },1500);
});
</script>
