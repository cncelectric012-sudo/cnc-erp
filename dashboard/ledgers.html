<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Ledgers · CNC Electric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
/* ── Grid & Cards ── */
.client-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
.client-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:all .15s; }
.client-card:hover { border-color:var(--border-2); box-shadow:var(--shadow-md); transform:translateY(-1px); }
.client-card-bar { height:3px; width:100%; }
.client-card-bar.green  { background:var(--green); }
.client-card-bar.yellow { background:var(--yellow); }
.client-card-bar.orange { background:var(--orange); }
.client-card-bar.red    { background:var(--red); }
.client-card-body { padding:16px; }
.client-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
.client-name { font-size:15px; font-weight:700; margin-bottom:4px; word-break:break-word; }
.client-tags { display:flex; flex-wrap:wrap; gap:4px; }
.client-bal-block { text-align:right; flex-shrink:0; }
.client-bal-num { font-size:18px; font-weight:700; font-family:var(--font-mono); }
.client-bal-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
.client-contact-row { display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12px; color:var(--text-3); padding:10px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-bottom:12px; }
.client-contact-item { display:flex; align-items:center; gap:4px; }
.client-stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
.client-stat { background:var(--surface-2); padding:8px 10px; border-radius:6px; text-align:center; }
.client-stat-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
.client-stat-value { font-size:12px; font-weight:700; font-family:var(--font-mono); }
.client-bar-wrap { height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; margin-bottom:10px; }
.client-bar-fill { height:100%; border-radius:2px; }
.client-footer { display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border); padding-top:10px; font-size:11px; color:var(--text-3); }

/* ── Export Bar ── */
.export-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn-export { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:7px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; transition:all .15s; }
.btn-export:hover { background:var(--surface-2); border-color:var(--border-2); }

/* ── Toolbar ── */
.toolbar-grid { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
.toolbar-search { flex:1; min-width:180px; }

/* ── Modal ── */
.modal-client-name { font-size:22px; font-weight:700; margin-bottom:6px; }
.modal-tags { display:flex; flex-wrap:wrap; gap:6px; }
.detail-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
.detail-kpi { background:var(--surface-2); border-radius:8px; padding:12px; text-align:center; }
.detail-kpi-num { font-size:18px; font-weight:700; font-family:var(--font-mono); margin-bottom:3px; }
.detail-kpi-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; }
.contact-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; background:var(--surface-2); border-radius:10px; padding:16px; margin-bottom:20px; }
.contact-field-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
.contact-field-value { font-size:13px; font-weight:500; word-break:break-word; }
.txn-table-wrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; max-height:400px; overflow-y:auto; }
.txn-table { width:100%; border-collapse:collapse; }
.txn-table th { background:var(--surface-2); padding:9px 12px; font-size:10px; text-align:left; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; }
.txn-table td { padding:8px 12px; font-size:12px; border-bottom:1px solid var(--border); font-family:var(--font-mono); white-space:nowrap; }
.txn-table tr:last-child td { border-bottom:none; }
.txn-row-payment { background:rgba(16,185,129,.05); }
.tag { display:inline-flex; align-items:center; gap:3px; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:600; font-family:var(--font-mono); }
.tag-invoice { background:var(--blue-50); color:var(--blue); }
.tag-payment { background:var(--green-50); color:var(--green); }
.modal-tabs { display:flex; gap:2px; background:var(--surface-2); border-radius:8px; padding:3px; margin-bottom:14px; border:1px solid var(--border); }
.modal-tab-btn { flex:1; padding:7px 10px; border-radius:5px; border:none; background:transparent; cursor:pointer; font-size:12px; font-weight:500; color:var(--text-3); white-space:nowrap; }
.modal-tab-btn.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-xs); font-weight:600; }

/* ── Timeline ── */
.timeline-item { display:flex; gap:12px; margin-bottom:8px; align-items:flex-start; }
.timeline-dot { flex-shrink:0; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:14px; }
.timeline-card { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; }

/* ── Loading ── */
.loading-state { text-align:center; padding:60px 20px; color:var(--text-3); }
.loading-spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* sort */
.sort-btn { padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text-3); font-size:11px; font-weight:500; cursor:pointer; }
.sort-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }
</style>
</head>
<body data-page="ledgers">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar-title">Client Ledgers</div>
        <div class="topbar-sub" id="topbarSub">Loading from Supabase...</div>
      </div>
      <div class="topbar-actions export-bar">
        <button class="btn-export" onclick="exportCSV()">⬇ CSV</button>
        <button class="btn-export" onclick="exportExcel()">⬇ Excel</button>
        <button class="btn-export" onclick="exportPDF()">⬇ PDF</button>
        <button class="btn-export" onclick="exportImage()">⬇ Image</button>
      </div>
    </div>

    <div class="content">

      <!-- KPI Row -->
      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">Clients</div><div class="kpi-value" id="kv-clients">—</div></div>
        <div class="kpi-card red"><div class="kpi-label">Outstanding</div><div class="kpi-value" id="kv-outstanding">—</div></div>
        <div class="kpi-card blue"><div class="kpi-label">Total Sales</div><div class="kpi-value" id="kv-sales">—</div></div>
        <div class="kpi-card green"><div class="kpi-label">Collected</div><div class="kpi-value" id="kv-paid">—</div></div>
        <div class="kpi-card"><div class="kpi-label">Pending</div><div class="kpi-value" id="kv-pending">—</div></div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar-grid">
        <div class="toolbar-search">
          <input class="search-input" id="s-name" placeholder="Search client name, phone, address, city..." oninput="applyFilters()"/>
        </div>
        <select class="select" style="min-width:120px" id="s-risk" onchange="applyFilters()">
          <option value="">Risk: All</option>
          <option value="Low">🟢 Low</option>
          <option value="Medium">🟡 Medium</option>
          <option value="High">🔴 High</option>
        </select>
        <select class="select" style="min-width:140px" id="s-outstanding" onchange="applyFilters()">
          <option value="">Outstanding: All</option>
          <option value="0">Zero Balance</option>
          <option value="1-50000">1 – 50K</option>
          <option value="50000-200000">50K – 200K</option>
          <option value="200000-500000">200K – 500K</option>
          <option value="500000+">500K+</option>
        </select>
        <select class="select" style="min-width:140px" id="s-salesperson" onchange="applyFilters()">
          <option value="">All Sales Reps</option>
        </select>
        <select class="select" style="min-width:120px" id="s-city" onchange="applyFilters()">
          <option value="">All Cities</option>
        </select>
        <select class="select" style="min-width:120px" id="s-type" onchange="applyFilters()">
          <option value="">Balance: All</option>
          <option value="Dr">Dr (Owe Us)</option>
          <option value="Cr">Cr (We Owe)</option>
          <option value="Nil">Nil (Clear)</option>
        </select>
        <div class="toolbar-divider"></div>
        <span style="font-size:11px;color:var(--text-3)">Sort:</span>
        <button class="sort-btn active" id="sort-outstanding" onclick="setSort('outstanding')">Outstanding</button>
        <button class="sort-btn" id="sort-sales" onclick="setSort('sales')">Total Sales</button>
        <button class="sort-btn" id="sort-name" onclick="setSort('name')">Name</button>
        <button class="sort-btn" id="sort-risk" onclick="setSort('risk')">Risk</button>
      </div>
      <!-- Count -->
      <div style="font-size:12px;color:var(--text-3);margin-bottom:10px" id="ledgerCount"></div>

      <!-- Grid -->
      <div id="ledgerGrid" class="client-grid">
        <div class="loading-state" style="grid-column:1/-1">
          <div class="loading-spinner"></div>
          <div>Loading clients from Supabase...</div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Detail Modal -->
<div class="modal-overlay hidden" id="clientModal">
  <div class="modal-box" style="max-width:900px">
    <div class="modal-header">
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Client Ledger</div>
        <div class="modal-client-name" id="m-name">—</div>
        <div class="modal-tags" id="m-badges"></div>
      </div>
      <div style="display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap">
        <button class="btn-export" onclick="exportClientPDF()" style="font-size:11px;padding:5px 10px">🖨️ Print</button>
        <button class="btn-export" onclick="exportClientCSV()" style="font-size:11px;padding:5px 10px">⬇ CSV</button>
        <button class="btn-export" id="m-wa-btn" style="font-size:11px;padding:5px 10px;background:var(--green-50);border-color:var(--green-100);color:var(--green)">💬 WhatsApp</button>
        <button class="btn-export" id="m-edit-btn" style="font-size:11px;padding:5px 10px;background:var(--blue-50);border-color:var(--blue-100);color:var(--blue)">✏️ Edit</button>
        <button class="btn-export" id="m-del-btn" style="font-size:11px;padding:5px 10px;background:var(--red-50);border-color:var(--red-100);color:var(--red)">🗑 Delete</button>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-body">

      <!-- Contact Info -->
      <div class="contact-grid" id="m-contact"></div>

      <!-- KPIs -->
      <div class="detail-kpi-row" id="m-kpis"></div>

      <!-- Tabs -->
      <div class="modal-tabs">
        <button class="modal-tab-btn active" onclick="switchTab('all')">All Transactions</button>
        <button class="modal-tab-btn" onclick="switchTab('invoices')">Invoices</button>
        <button class="modal-tab-btn" onclick="switchTab('payments')">Payments</button>
        <button class="modal-tab-btn" onclick="switchTab('aging')">📅 Aging</button>
        <button class="modal-tab-btn" onclick="switchTab('timeline')">Timeline</button>
      </div>

      <div id="m-txn-wrap">
        <div class="txn-table-wrap">
          <table class="txn-table">
            <thead>
              <tr>
                <th>#</th><th>Date</th><th>Type</th><th>Voucher</th>
                <th style="text-align:right">Debit</th><th style="text-align:right">Credit</th><th style="text-align:right">Balance</th>
              </tr>
            </thead>
            <tbody id="m-txn-body"></tbody>
          </table>
        </div>
      </div>
      <div id="m-aging" style="display:none"></div>
      <div id="m-timeline" style="display:none"></div>
    </div>
  </div>
</div>

<!-- SheetJS for Excel -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<!-- html2canvas for Image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/supabase-config.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/core.js"></script>

<script>
// ── State ──────────────────────────────────────────────────────
let allClients = [];      // raw from Supabase
let filtered   = [];      // after filters
let currentSort = 'outstanding';
let currentClient = null; // for modal
let currentTab = 'all';

// ── Formatters ─────────────────────────────────────────────────
const num = v => { const n = parseFloat(String(v||0).replace(/,/g,'')); return isNaN(n)?0:n; };
const fmt = n => new Intl.NumberFormat('en-PK',{maximumFractionDigits:0}).format(Math.round(n||0));
const fmtK = n => {
  if (n>=10000000) return (n/10000000).toFixed(1)+' Cr';
  if (n>=100000)   return (n/100000).toFixed(1)+' L';
  if (n>=1000)     return (n/1000).toFixed(1)+' K';
  return Math.round(n).toString();
};

const LAPI = 'https://knvaaxywlfpomlatpiua.supabase.co/rest/v1';
const LKEY = 'sb_publishable_z46NMjGWepbZoD8uAvqBpg__J-wSALN';
const LHDR = { 'apikey': LKEY, 'Authorization': 'Bearer ' + LKEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

async function lFetch(params) {
  const r = await fetch(`${LAPI}/clients?${params}`, { headers: LHDR });
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
  return r.json();
}

// ── Load all clients ──────────────────────────────────────────
async function loadClients() {
  const sub = document.getElementById('topbarSub');
  const grid = document.getElementById('ledgerGrid');
  try {
    sub.textContent = 'Loading...';
    // Load first 200 fast
    const first = await lFetch('limit=200&offset=0&order=name.asc');
    allClients = first || [];
    populateDropdowns();
    applyFilters();
    sub.textContent = `${allClients.length} clients`;

    // Load rest in background
    if (first.length === 200) {
      let offset = 200;
      while(true) {
        const batch = await lFetch(`limit=500&offset=${offset}&order=name.asc`);
        if (!batch || !batch.length) break;
        allClients = allClients.concat(batch);
        sub.textContent = `Loading... ${allClients.length}`;
        if (batch.length < 500) break;
        offset += 500;
      }
      populateDropdowns();
      applyFilters();
      sub.textContent = `${allClients.length} clients loaded`;
    }
  } catch (err) {
    sub.textContent = '⚠️ ' + err.message;
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><div class="empty-title">Load Failed</div><div class="empty-desc" style="color:red;font-size:12px">${err.message}</div></div>`;
  }
}

// ── Populate dropdowns ─────────────────────────────────────────
function populateDropdowns() {
  const sps    = [...new Set(allClients.map(c=>c.salesperson).filter(Boolean))].sort();
  const cities = [...new Set(allClients.map(c=>c.city).filter(Boolean))].sort();

  const spSel = document.getElementById('s-salesperson');
  spSel.innerHTML = '<option value="">All Sales Reps</option>' +
    sps.map(s=>`<option value="${s}">${s}</option>`).join('');

  const citySel = document.getElementById('s-city');
  citySel.innerHTML = '<option value="">All Cities</option>' +
    cities.map(c=>`<option value="${c}">${c}</option>`).join('');
}

// ── Apply Filters + Sort ───────────────────────────────────────
function applyFilters() {
  const search = (document.getElementById('s-name').value||'').toLowerCase();
  const risk   = document.getElementById('s-risk').value;
  const osRange= document.getElementById('s-outstanding').value;
  const sp     = document.getElementById('s-salesperson').value;
  const city   = document.getElementById('s-city').value;
  const type   = document.getElementById('s-type').value;

  filtered = allClients.filter(c => {
    if (search) {
      const h = [c.name,c.phone,c.address,c.city,c.contact_person,c.salesperson].join(' ').toLowerCase();
      if (!h.includes(search)) return false;
    }
    if (risk && c.risk_level !== risk) return false;
    if (type && c.outstanding_type !== type) return false;
    if (sp   && c.salesperson !== sp) return false;
    if (city && c.city !== city) return false;
    if (osRange) {
      const os = num(c.outstanding_amount);
      if (osRange === '0' && os !== 0) return false;
      if (osRange === '1-50000' && (os <= 0 || os > 50000)) return false;
      if (osRange === '50000-200000' && (os <= 50000 || os > 200000)) return false;
      if (osRange === '200000-500000' && (os <= 200000 || os > 500000)) return false;
      if (osRange === '500000+' && os <= 500000) return false;
    }
    return true;
  });

  // Sort
  if (currentSort === 'outstanding') filtered.sort((a,b)=>num(b.outstanding_amount)-num(a.outstanding_amount));
  else if (currentSort === 'sales')  filtered.sort((a,b)=>num(b.totalInvoiced)-num(a.totalInvoiced));
  else if (currentSort === 'name')   filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if (currentSort === 'risk')   {
    const rl = {High:3,Medium:2,Low:1};
    filtered.sort((a,b)=>(rl[b.risk_level]||0)-(rl[a.risk_level]||0));
  }

  updateKPIs();
  renderGrid();
}

function setSort(key) {
  currentSort = key;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById('sort-'+key);
  if (el) el.classList.add('active');
  applyFilters();
}

// ── Update KPIs ────────────────────────────────────────────────
function updateKPIs() {
  const totalOS    = filtered.reduce((s,c)=>s+num(c.outstanding_amount),0);
  const totalSales = filtered.reduce((s,c)=>s+num(c.total_invoiced),0);
  const totalPaid  = filtered.reduce((s,c)=>s+num(c.total_paid),0);
  const totalPend  = filtered.reduce((s,c)=>s+(c.outstanding_type==='Dr'?num(c.outstanding_amount):0),0);

  document.getElementById('kv-clients').textContent     = filtered.length;
  document.getElementById('kv-outstanding').textContent = 'PKR '+fmtK(totalOS);
  document.getElementById('kv-sales').textContent       = 'PKR '+fmtK(totalSales);
  document.getElementById('kv-paid').textContent        = 'PKR '+fmtK(totalPaid);
  document.getElementById('kv-pending').textContent     = 'PKR '+fmtK(totalPend);
}

// ── Render Grid ────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('ledgerGrid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">No clients found</div>
      <div class="empty-desc">Try changing your filters</div>
    </div>`;
    return;
  }

  // safe: use reduce instead of spread to avoid call stack issues
  const maxOS = filtered.reduce((m,c)=>Math.max(m,num(c.outstanding_amount)),1);

  try {
    grid.innerHTML = filtered.map(c => {
      const os   = num(c.outstanding_amount);
      const paid = num(c.total_paid);
      const inv  = num(c.total_invoiced);
      const rec  = inv > 0 ? Math.round(paid/inv*100) : 100;
      const pct  = Math.min(100,(os/maxOS)*100);
      const risk = c.risk_level || 'Low';
      const zc   = risk === 'High' ? 'red' : risk === 'Medium' ? 'yellow' : 'green';
      const balColor = zc === 'red' ? 'var(--red)' : zc === 'yellow' ? 'var(--yellow)' : 'var(--green)';
      // safely parse transactions — might be string JSON or array or null
      let txns = [];
      try {
        const raw = c.transactions;
        txns = Array.isArray(raw) ? raw : (typeof raw === 'string' && raw ? JSON.parse(raw) : []);
      } catch(e) { txns = []; }
      const invoiceCount = txns.filter(t=>t&&t.type==='Invoice').length;
      const paymentCount = txns.filter(t=>t&&(t.type==='Payment'||t.type==='Receipt')).length;
      const safeId = String(c.id||'').replace(/'/g,"\\'");
      const phone = c.phone || c.whatsapp || '';
      const waNum = phone ? '92'+phone.replace(/^0/,'').replace(/[^0-9]/g,'') : '';

      return `
      <div class="client-card" onclick="openModal('${safeId}')">
        <div class="client-card-bar ${zc}"></div>
        <div class="client-card-body">
          <div class="client-card-top">
            <div style="flex:1;min-width:0">
              <div class="client-name">${c.name||'—'}</div>
              <div class="client-tags">
                <span class="badge badge-${zc}">${risk} Risk</span>
                <span class="badge badge-gray">${c.outstanding_type||'Dr'}</span>
                ${c.salesperson?`<span class="badge badge-blue">👤 ${c.salesperson}</span>`:''}
              </div>
            </div>
            <div class="client-bal-block">
              <div class="client-bal-num" style="color:${balColor}">${fmtK(os)}</div>
              <div class="client-bal-label">Outstanding</div>
            </div>
          </div>
          <div class="client-contact-row">
            ${c.phone?`<div class="client-contact-item">📞 ${c.phone}</div>`:''}
            ${c.city?`<div class="client-contact-item">📍 ${c.city}</div>`:''}

    ['City',         'city',              c.city||''],
    ['Phone',        'phone',             c.phone||''],
    ['Address',      'address',           c.address||''],
    ['Contact Person','contact_person',   c.contact_person||''],
    ['Email',        'email',             c.email||''],
    ['Salesperson',  'salesperson',       c.salesperson||''],
    ['Outstanding (PKR)','outstanding_amount', c.outstanding_amount||0],
    ['Risk Level',   'risk_level',        c.risk_level||'Medium'],
    ['Avg Pay Days', 'avg_payment_days',  c.avg_payment_days||''],

    <div style="background:var(--surface);border-radius:14px;padding:24px;width:100%;max-width:580px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)">

async function saveLedgerEdit(id) {
  const fields = ['name','city','phone','address','contact_person','email','salesperson','outstanding_amount','risk_level','avg_payment_days'];
  const update = {};
  fields.forEach(k => {
    const el = document.getElementById('le-'+k);
    if(el) update[k] = k==='outstanding_amount' ? parseFloat(el.value)||0 : el.value.trim();
  });
  update.last_updated = new Date().toISOString();

  const r = await fetch(`${LAPI}/clients?id=eq.${id}`, {
    method:'PATCH', headers:{...LHDR,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify(update)
  });
  if(r.ok) {
    showToast('Ledger updated','✅');
    document.getElementById('ledger-edit-panel').remove();
    closeModal();
    await loadClients();
  } else {
    showToast('Save failed','❌');
  }
}

async function deleteLedgerClient(id, name) {
  if(!confirm(`"${name}" ka ledger delete karo? Saari transactions bhi hat jaayengi.`)) return;
  const r = await fetch(`${LAPI}/clients?id=eq.${id}`, { method:'DELETE', headers:LHDR });
  if(r.ok) {
    showToast(`${name} deleted`,'🗑️');
    closeModal();
    await loadClients();
  } else {
    showToast('Delete failed','❌');
  }
}

function switchTab(tab) {
  currentTab = tab;
  const tabs = ['all','invoices','payments','aging','timeline'];
  document.querySelectorAll('.modal-tab-btn').forEach((b,i)=>b.classList.toggle('active',tabs[i]===tab));
  document.getElementById('m-txn-wrap').style.display = 'none';
  document.getElementById('m-timeline').style.display  = 'none';
  document.getElementById('m-aging').style.display     = 'none';
  if(tab==='timeline'){ document.getElementById('m-timeline').style.display='block'; renderTimeline(currentClient); }
  else if(tab==='aging'){ document.getElementById('m-aging').style.display='block'; renderAging(currentClient); }
  else { document.getElementById('m-txn-wrap').style.display='block'; renderTxnTable(currentClient,tab); }
}

// ── Aging Analysis ─────────────────────────────────────────────
function renderAging(c) {
  const today = new Date();
  const txns = (c.transactions||[]).filter(t=>t.type==='Invoice');
  const buckets = [{lbl:'0-30 days',min:0,max:30,color:'var(--green)',items:[]},{lbl:'31-60 days',min:31,max:60,color:'var(--yellow)',items:[]},{lbl:'61-90 days',min:61,max:90,color:'var(--orange)',items:[]},{lbl:'90+ days',min:91,max:9999,color:'var(--red)',items:[]}];

  txns.forEach(t=>{
    const d = sortDate(t.date);
    if(!d) return;
    const days = Math.floor((today - d)/86400000);
    const b = buckets.find(x=>days>=x.min&&days<=x.max);
    if(b) b.items.push({...t, days});
  });

  const total = buckets.reduce((s,b)=>s+b.items.reduce((ss,t)=>ss+num(t.amount),0),0);

  const el = document.getElementById('m-aging');
  el.innerHTML = `
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
    ${buckets.map(b=>{
      const amt = b.items.reduce((s,t)=>s+num(t.amount),0);
      const pct = total>0?Math.round(amt/total*100):0;
      return `<div style="background:var(--surface-2);border-radius:8px;padding:12px;text-align:center;border-top:3px solid ${b.color}">
        <div style="font-size:18px;font-weight:800;color:${b.color}">PKR ${fmtK(amt)}</div>
        <div style="font-size:10px;color:var(--text-3);margin-top:3px;text-transform:uppercase">${b.lbl}</div>
        <div style="font-size:11px;font-weight:600;margin-top:4px">${b.items.length} invoices · ${pct}%</div>
      </div>`;
    }).join('')}
  </div>
  ${buckets.filter(b=>b.items.length>0).map(b=>`
  <div style="margin-bottom:12px">
    <div style="font-weight:600;font-size:12px;color:${b.color};margin-bottom:6px">📅 ${b.lbl} (${b.items.length})</div>
    <div class="txn-table-wrap" style="max-height:150px">
      <table class="txn-table"><thead><tr><th>Date</th><th>Voucher</th><th style="text-align:right">Amount</th><th style="text-align:right">Days</th></tr></thead>
      <tbody>${b.items.map(t=>`<tr><td>${t.date||'—'}</td><td>${t.voucher||'—'}</td><td style="text-align:right">PKR ${fmt(num(t.amount))}</td><td style="text-align:right;color:${b.color};font-weight:600">${t.days}d</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`).join('')}
  ${!txns.length?'<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">No invoice transactions for aging analysis</div></div>':''}`;
}

function renderTxnTable(c, filter) {
  let txns = (c.transactions||[]).slice().sort((a,b)=>sortDate(a.date)-sortDate(b.date));
  if (filter==='invoices') txns = txns.filter(t=>t.type==='Invoice');
  if (filter==='payments') txns = txns.filter(t=>t.type==='Payment'||t.type==='Receipt');

  // Compute running balance
  let bal = 0;
  const rows = txns.map((t,i) => {
    const amt  = num(t.amount);
    const isInv = t.type==='Invoice';
    const isPay = t.type==='Payment'||t.type==='Receipt';
    if (isInv) bal += amt;
    if (isPay) bal -= amt;
    const balDisplay = bal;
    return `
    <tr class="${isPay?'txn-row-payment':''}">
      <td style="color:var(--text-3)">${i+1}</td>
      <td>${t.date||'—'}</td>
      <td><span class="tag ${isPay?'tag-payment':'tag-invoice'}">${isPay?'💰 Payment':'📄 Invoice'}</span></td>
      <td style="font-weight:600">${t.voucher||'—'}</td>
      <td style="text-align:right">${isInv?'PKR '+fmt(amt):'—'}</td>
      <td style="text-align:right;color:var(--green)">${isPay?'PKR '+fmt(amt):'—'}</td>
      <td style="text-align:right;font-weight:600;color:${balDisplay>0?'var(--red)':'var(--green)'}">${balDisplay>0?'PKR '+fmt(balDisplay):balDisplay<0?'-PKR '+fmt(Math.abs(balDisplay)):'0'}</td>
    </tr>`;
  });

  document.getElementById('m-txn-body').innerHTML = rows.join('') ||
    '<tr><td colspan="7" style="text-align:center;color:var(--text-3);padding:20px">No transactions</td></tr>';
}

function sortDate(s) {
  if (!s) return 0;
  const parts = String(s).split(/[\/-]/);
  if (parts.length===3 && parts[2].length===4) return new Date(+parts[2],+parts[1]-1,+parts[0]).getTime();
  return new Date(s).getTime()||0;
}

function renderTimeline(c) {
  const txns = (c.transactions||[]).slice().sort((a,b)=>sortDate(a.date)-sortDate(b.date));
  if (!txns.length) {
    document.getElementById('m-timeline').innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">No transactions</div></div>';
    return;
  }
  document.getElementById('m-timeline').innerHTML = txns.map(t=>{
    const isPay = t.type==='Payment'||t.type==='Receipt';
    const amt = num(t.amount);
    const color = isPay?'var(--green)':'var(--blue)';
    const bg    = isPay?'rgba(16,185,129,.1)':'rgba(59,130,246,.1)';
    const icon  = isPay?'💰':'📄';
    const label = isPay?`PKR ${fmt(amt)} received`:`PKR ${fmt(amt)} invoiced`;
    return `
    <div class="timeline-item">
      <div class="timeline-dot" style="background:${bg}">${icon}</div>
      <div class="timeline-card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-weight:600;font-size:13px;color:${color}">${label}</span>
          <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-3)">${t.date||''}</span>
        </div>
        <div style="font-size:11px;color:var(--text-3);margin-top:3px">${t.voucher||''} ${t.description?'· '+t.description:''}</div>
      </div>
    </div>`;
  }).join('');
}

// ── Export Functions ───────────────────────────────────────────
function buildExportRows(clientList) {
  const rows = [];
  for (const c of clientList) {
    const inv  = num(c.total_invoiced);
    const paid = num(c.total_paid);
    const os   = num(c.outstanding_amount);
    const rec  = inv>0?Math.round(paid/inv*100):100;
    rows.push({
      'Client Name':    c.name||'',
      'Phone':          c.phone||'',
      'Address':        c.address||'',
      'City':           c.city||'',
      'Contact Person': c.contact_person||'',
      'Sales Person':   c.salesperson||'',
      'Outstanding (PKR)': os,
      'Balance Type':   c.outstanding_type||'',
      'Total Invoiced': inv,
      'Total Paid':     paid,
      'Recovery %':     rec,
      'Risk Level':     c.risk_level||'',
      'Avg Payment Days': c.avg_payment_days||'',
      'Transactions':   (c.transactions||[]).length,
      'Last Updated':   c.last_updated||''
    });
  }
  return rows;
}

function exportCSV() {
  const rows = buildExportRows(filtered);
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(','),
    ...rows.map(r=>headers.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))
  ].join('\n');
  downloadFile('cnc_ledgers.csv','text/csv;charset=utf-8;',csv);
  showToast('CSV exported','⬇');
}

    <div class="kpi"><div class="kpi-val">PKR ${fmt(os)}</div><div class="kpi-lbl">Outstanding</div></div>

    <div class="kpi"><div class="kpi-val">PKR ${fmt(paid)}</div><div class="kpi-lbl">Total Paid</div></div>
    <div class="kpi"><div class="kpi-val">${rec}%</div><div class="kpi-lbl">Recovery</div></div>
  </div>
  <table>
    <thead><tr><th>#</th><th>Date</th><th>Type</th><th>Voucher</th><th>Amount (PKR)</th></tr></thead>
    <tbody>${txns.map((t,i)=>`<tr class="${t.type==='Payment'||t.type==='Receipt'?'pay':''}">
      <td>${i+1}</td><td>${t.date||'—'}</td><td>${t.type||'—'}</td>
      <td>${t.voucher||'—'}</td><td>${fmt(num(t.amount))}</td>
    </tr>`).join('')}</tbody>
  </table>
  <script>window.onload=()=>window.print()<\/script>
  </body></html>`);
  w.document.close();
}

function downloadFile(name, type, content) {
  const blob = new Blob([content],{type});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

// ── Toast ──────────────────────────────────────────────────────
function showToast(msg, icon='✓') {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div'); t.id='toast'; t.className='toast';
    t.innerHTML='<span id="toastIcon"></span><span id="toastMsg"></span>';
    document.body.appendChild(t);
  }
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = icon;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ── Init ───────────────────────────────────────────────────────
document.addEventListener('click', e => {
  if (e.target.id==='clientModal') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape') closeModal();
});

document.addEventListener('DOMContentLoaded', () => {
  renderSidebar('ledgers');
  // Wait for auth-guard to finish before loading data
  const tryLoad = () => {
    if (window.authReady) { loadClients(); return; }
    setTimeout(tryLoad, 150);
  };
  tryLoad();

  // Auto-open if URL has ?open=
  const p = new URLSearchParams(window.location.search);
  if (p.has('open')) setTimeout(()=>{
    const c = allClients.find(x=>x.name===p.get('open'));
    if (c) openModal(c.id);
  },1500);
});
</script>
</body>
</html>
