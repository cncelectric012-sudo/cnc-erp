<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In · CNC Electric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
body { display:grid; place-items:center; min-height:100vh; background:var(--bg);
  background-image: radial-gradient(circle at 20% 0%, var(--brand-50), transparent 50%), radial-gradient(circle at 80% 100%, var(--blue-50), transparent 50%); }
.login-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:36px; width:100%; max-width:400px; box-shadow:var(--shadow-lg); }
.login-brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid var(--border); }
.login-logo { width:40px; height:40px; background:var(--brand); color:white; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:16px; }
.login-brand-name { font-weight:700; font-size:16px; }
.login-brand-sub { font-size:12px; color:var(--text-3); }
.login-title { font-size:22px; font-weight:700; margin-bottom:6px; }
.login-sub { font-size:13px; color:var(--text-3); margin-bottom:24px; }
.error-box { display:none; background:var(--red-50); border:1px solid var(--red-100); color:var(--red); padding:10px 12px; border-radius:6px; font-size:12px; margin-bottom:14px; }
.error-box.show { display:block; }
.login-footer { margin-top:24px; padding-top:18px; border-top:1px solid var(--border); text-align:center; font-size:11px; color:var(--text-4); }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-brand">
    <div class="login-logo">C</div>
    <div>
      <div class="login-brand-name">CNC Electric</div>
      <div class="login-brand-sub">Credit Decision Engine</div>
    </div>
  </div>

  <div class="login-title">Welcome back</div>
  <div class="login-sub">Sign in to access the dashboard</div>

  <div class="error-box" id="errorBox"></div>

  <div id="noAccessMsg" style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;text-align:center">
    ⛔ Aap ko is page ka access nahi hai. Admin se contact karein.
  </div>

  <div class="field">
    <label>Username or Email</label>
    <input class="input" type="text" id="username" placeholder="username ya email" autocomplete="username"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()"/>
  </div>

  <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" id="loginBtn" onclick="doLogin()">Sign In</button>

  <div class="login-footer">Authorized users only · CNC Electric Pakistan</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL  = 'https://knvaaxywlfpomlatpiua.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_z46NMjGWepbZoD8uAvqBpg__J-wSALN';
const API           = SUPABASE_URL + '/rest/v1';
const HDR           = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };
const sbClient      = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Show no-access message
if(new URLSearchParams(window.location.search).get('noaccess')) {
  document.getElementById('noAccessMsg').style.display = 'block';
}

// If already logged in via app_users session → redirect
try {
  const appSess = JSON.parse(localStorage.getItem('cnc_app_session') || 'null');
  if(appSess?.id && !new URLSearchParams(window.location.search).get('noaccess')) {
    window.location.href = 'index.html';
  }
} catch(e){}

// If already logged in via Supabase Auth → redirect
sbClient.auth.getSession().then(({ data: { session } }) => {
  if(session && !new URLSearchParams(window.location.search).get('noaccess')) {
    window.location.href = 'index.html';
  }
});

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.add('show');
}

async function doLogin() {
  const input    = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if(!input || !password) { showError('Username aur password daalen'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  document.getElementById('errorBox').classList.remove('show');

  // ── Step 1: Try app_users (username or email match) ────────
  try {
    const hash = await sha256(password);
    const isEmail = input.includes('@');
    const field   = isEmail ? 'email' : 'username';
    const resp    = await fetch(
      `${API}/app_users?${field}=eq.${encodeURIComponent(input)}&password_hash=eq.${hash}&active=eq.true&select=id,name,username,email,role_id`,
      { headers: HDR }
    );
    const users = await resp.json();

    if(users && users.length) {
      const u = users[0];
      // Save local session
      const session = { id:u.id, name:u.name, username:u.username, email:u.email, role_id:u.role_id, via:'app_users', ts: Date.now() };
      localStorage.setItem('cnc_app_session', JSON.stringify(session));
      // Update last_login
      fetch(`${API}/app_users?id=eq.${u.id}`, { method:'PATCH', headers:{...HDR,'Prefer':'return=minimal'}, body:JSON.stringify({last_login:new Date().toISOString()}) });
      window.location.href = 'index.html';
      return;
    }
  } catch(e) { console.warn('app_users check failed:', e); }

  // ── Step 2: Try Supabase Auth (owner email login) ──────────
  if(input.includes('@')) {
    sbClient.auth.signInWithPassword({ email: input, password })
      .then(({ error }) => {
        btn.disabled = false; btn.textContent = 'Sign In';
        if(error) {
          showError('Wrong username/email or password');
        } else {
          window.location.href = 'index.html';
        }
      });
  } else {
    btn.disabled = false; btn.textContent = 'Sign In';
    showError('Wrong username or password');
  }
}
</script>
</body>
</html>
