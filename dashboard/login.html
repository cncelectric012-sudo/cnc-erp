<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In · CNC Electric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 20% 0%, var(--brand-50), transparent 50%),
    radial-gradient(circle at 80% 100%, var(--blue-50), transparent 50%);
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow-lg);
}
.login-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.login-logo {
  width: 40px; height: 40px;
  background: var(--brand);
  color: white;
  border-radius: 10px;
  display: grid; place-items: center;
  font-weight: 800; font-size: 16px;
}
.login-brand-text { line-height: 1.3; }
.login-brand-name { font-weight: 700; font-size: 16px; }
.login-brand-sub { font-size: 12px; color: var(--text-3); }
.login-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
}
.login-sub {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 24px;
}
.error-box {
  display: none;
  background: var(--red-50);
  border: 1px solid var(--red-100);
  color: var(--red);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 12px;
  margin-bottom: 14px;
}
.error-box.show { display: block; }
.login-footer {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 11px;
  color: var(--text-4);
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <div class="login-logo">C</div>
    <div class="login-brand-text">
      <div class="login-brand-name">CNC Electric</div>
      <div class="login-brand-sub">Credit Decision Engine</div>
    </div>
  </div>

  <div class="login-title">Welcome back</div>
  <div class="login-sub">Sign in to access the dashboard</div>

  <div class="error-box" id="errorBox"></div>

  <div class="field">
    <label>Email</label>
    <input class="input" type="email" id="email" placeholder="you@cncelectric.pk" autocomplete="email"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input class="input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()"/>
  </div>

  <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center" id="loginBtn" onclick="doLogin()">Sign In</button>

  <div id="noAccessMsg" style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;text-align:center">
    ⛔ Aap ko is page ka access nahi hai. Admin se contact karein.
  </div>
  <div class="login-footer">Authorized users only · CNC Electric Pakistan</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://knvaaxywlfpomlatpiua.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_z46NMjGWepbZoD8uAvqBpg__J-wSALN';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Show no-access message if redirected from a protected page
if(new URLSearchParams(window.location.search).get('noaccess')) {
  document.getElementById('noAccessMsg').style.display = 'block';
}

// If already logged in, redirect
client.auth.getSession().then(({ data: { session } }) => {
  if (session && !new URLSearchParams(window.location.search).get('noaccess')) {
    window.location.href = 'index.html';
  }
});

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.add('show');
}

function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { showError('Email aur password dono daalen'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  document.getElementById('errorBox').classList.remove('show');

  client.auth.signInWithPassword({ email, password })
    .then(({ error }) => {
      if (error) {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        if (error.message.includes('Invalid')) showError('Wrong email or password');
        else showError(error.message);
      } else {
        window.location.href = 'index.html';
      }
    });
}
</script>
</body>
</html>
