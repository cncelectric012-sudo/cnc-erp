<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>PayGate · CNC Electric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
/* ─── Stats ─────────────────────────────────────────────────── */
.pg-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.pg-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;position:relative;overflow:hidden}
.pg-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.pg-stat.s-total::before{background:var(--blue)}
.pg-stat.s-pending::before{background:var(--yellow)}
.pg-stat.s-verified::before{background:var(--blue)}
.pg-stat.s-posted::before{background:var(--green)}
.pg-stat.s-rejected::before{background:var(--red)}
.pg-stat .v{font-size:24px;font-weight:800;font-family:var(--font-mono)}
.pg-stat .l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.pg-stat .sub{font-size:11px;color:var(--text-3);margin-top:2px}

/* ─── Tabs ───────────────────────────────────────────────────── */
.pg-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.pg-tab{padding:9px 16px;font-size:13px;font-weight:500;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.pg-tab.active{color:var(--brand);border-bottom-color:var(--brand)}

/* ─── Submit Form ────────────────────────────────────────────── */
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-2col .full{grid-column:1/-1}
.entity-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ent-btn{padding:10px;border:1.5px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-weight:700;font-size:13px;transition:all .15s;background:var(--surface)}
.ent-btn.sel{border-color:var(--brand);background:var(--brand-50);color:var(--brand)}
.type-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-btn{padding:9px;border:1.5px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;background:var(--surface)}
.type-btn.sel{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.photo-zone{border:2px dashed var(--border-2);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:border-color .15s}
.photo-zone:hover{border-color:var(--brand)}
.photo-zone img{max-width:100%;border-radius:8px;margin-top:8px;max-height:200px;object-fit:cover}
.submit-btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--green);color:white;box-shadow:0 4px 12px rgba(5,150,105,.3);transition:all .15s}
.submit-btn:disabled{background:var(--surface-2);color:var(--text-3);cursor:not-allowed;box-shadow:none}
.bank-hint{background:var(--blue-50);border:1px solid var(--blue-100);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--blue);margin-bottom:10px}

/* ─── Payment Cards ──────────────────────────────────────────── */
.pay-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;margin-bottom:8px}
.pay-card:hover{border-color:var(--brand);box-shadow:var(--shadow-sm)}
.pay-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pay-name{font-weight:600;font-size:14px}
.pay-meta{font-size:11px;color:var(--text-3);margin-top:2px}
.pay-amt{font-size:18px;font-weight:700;font-family:var(--font-mono);white-space:nowrap}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:600}
.status-pill.pending{background:var(--yellow-50);color:var(--yellow)}
.status-pill.verified{background:var(--blue-50);color:var(--blue)}
.status-pill.posted{background:var(--green-50);color:var(--green)}
.status-pill.rejected{background:var(--red-50);color:var(--red)}

/* ─── Report Tables ──────────────────────────────────────────── */
.report-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.report-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface-2)}
.report-hdr h3{font-size:13px;font-weight:700;margin:0}

/* ─── Bar Chart ──────────────────────────────────────────────── */
.mini-chart{display:flex;align-items:flex-end;gap:4px;height:60px;padding:0 4px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar{width:100%;background:var(--brand-50);border-radius:3px 3px 0 0;transition:height .3s;min-height:2px;position:relative}
.bar:hover{background:var(--brand)}
.bar-lbl{font-size:8px;color:var(--text-3);white-space:nowrap}

/* ─── Autocomplete ───────────────────────────────────────────── */
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1.5px solid var(--brand);border-top:none;border-radius:0 0 8px 8px;max-height:220px;overflow-y:auto;z-index:50;box-shadow:var(--shadow-md)}
.ac-item{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.ac-item:hover{background:var(--surface-2)}
.ac-item:last-child{border-bottom:none}

/* ─── Detail Modal ───────────────────────────────────────────── */
.pg-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.pg-modal-bg.hidden{display:none}
.pg-modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:20px 18px 32px}
.pg-modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border-2);margin:0 auto 16px}

/* ─── Filter Bar ─────────────────────────────────────────────── */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}

/* ─── Timeline ───────────────────────────────────────────────── */
.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.timeline-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.timeline-dot.posted{background:var(--green)}
.timeline-dot.verified{background:var(--blue)}
.timeline-dot.pending{background:var(--yellow)}
.timeline-dot.rejected{background:var(--red)}

@media(max-width:700px){
  .pg-stats{grid-template-columns:repeat(2,1fr)}
  .form-2col{grid-template-columns:1fr}
  .form-2col .full{grid-column:1}
}
@media(max-width:400px){
  .pg-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body data-page="paygate">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar-title">💰 PayGate</div>
        <div class="topbar-sub" id="pgSub">Loading...</div>
      </div>
      <div class="topbar-actions">
        <div id="viewToggle" class="hidden" style="display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:8px">
          <button class="btn btn-ghost btn-sm active" id="vbField" onclick="setView('field',this)" style="padding:5px 12px">📱 Field</button>
          <button class="btn btn-ghost btn-sm" id="vbAdmin" onclick="setView('admin',this)" style="padding:5px 12px">🖥️ Admin</button>
        </div>
        <span id="pgUserBadge" style="font-size:12px;color:var(--text-3)"></span>
      </div>
    </div>

    <div class="content" id="pgContent">
      <div class="empty"><div class="empty-icon">💰</div><div class="empty-title">Loading PayGate...</div></div>
    </div>
  </main>
</div>

<!-- Detail Modal -->
<div class="pg-modal-bg hidden" id="pgDetailModal">
  <div class="pg-modal">
    <div class="pg-modal-handle"></div>
    <div id="pgDetailContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/supabase-config.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/core.js"></script>
<script>
const API = 'https://knvaaxywlfpomlatpiua.supabase.co/rest/v1';
const KEY = 'sb_publishable_z46NMjGWepbZoD8uAvqBpg__J-wSALN';
const HDR = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};

const BANKS = ['Meezan Bank','HBL','UBL','MCB','Allied Bank','Bank Alfalah (BAFL)','Bank Al-Habib (BAH)','NBP','Faysal Bank','Askari Bank','JS Bank','Habib Metro','Dubai Islamic Bank','JazzCash','EasyPaisa','NayaPay','SadaPay','Raast','Other'];
const BANK_ROUTING = {CNC:'BAH AOP ya Meezan Pvt',CST:'BAFL AOP (705) ya BAH AOP',CSPL:'BAFL 989 ya BAH Pvt'};
const PAY_TYPES = ['Ledger Client','Regular Client','Walking Customer','Advance Payment','New Client','GST Client'];

async function apiFetch(path,opts={}){
  const r=await fetch(API+path,{headers:HDR,...opts});
  if(!r.ok){const t=await r.text();throw new Error(t);}
  return r.status===204?null:r.json();
}

const PKR = n => 'PKR '+Number(n||0).toLocaleString('en-PK');
const fmtDate = d => d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'-';
const fmtDT   = d => d?new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';

let PGU=null, pgView='field', pgTab='submit';
let allEntries=[], myEntries=[], allClients=[];
let pgState={cust:'',amt:'',ent:'CNC',typ:'Ledger Client',bank:'',account:'',txnId:'',payDate:'',phone:'',invoice:'',bankmsg:'',note:'',photo:null};
let showAc=false;

// ── Init — wait for auth + permissions to fully load ──────────
const pgWait = setInterval(()=>{
  if(window.authReady){ clearInterval(pgWait); initPG(); }
},100);
setTimeout(()=>clearInterval(pgWait),10000);

async function initPG(){
  const u = window.currentUser;
  const appU = window.appUser;
  if(appU){ PGU={id:appU.id,name:appU.name||appU.username,role:appU.role_id,email:appU.email}; }
  else { PGU={id:u.id,name:u.email.split('@')[0],role:window.userRole||'super_admin',email:u.email}; }

  document.getElementById('pgUserBadge').textContent = PGU.name;

  const canAdmin = canDo('paygate.verify')||canDo('paygate.journal')||canDo('users.manage');
  document.getElementById('viewToggle').classList.toggle('hidden',!canAdmin);
  if(!canDo('paygate.submit')&&canAdmin){ pgView='admin'; }

  await loadData();
  render();
}

function canDo(p){ return !window.userPerms||window.userPerms.includes(p); }

async function loadData(){
  document.getElementById('pgSub').textContent='Loading...';
  const [entries,clients]=await Promise.all([
    apiFetch('/paygate_entries?order=created_at.desc&limit=1000'),
    apiFetch('/clients?select=id,name,city,salesperson&limit=5000&order=name.asc')
  ]);
  allEntries=entries||[];
  allClients=clients||[];
  myEntries=allEntries.filter(e=>e.submitted_by===PGU.name);
  document.getElementById('pgSub').textContent=`${allEntries.length} total payments`;
}

function setView(v,el){
  pgView=v;
  document.querySelectorAll('#viewToggle button').forEach(b=>{b.classList.remove('active','btn-primary');b.style.background='';});
  el.classList.add('active');
  el.style.background='var(--surface)';
  pgTab = v==='admin'?'all':'submit';
  render();
}

// ── Main Render ───────────────────────────────────────────────
function render(){
  const isAdmin = pgView==='admin';
  const src = isAdmin?allEntries:myEntries;
  const today=new Date().toISOString().slice(0,10);

  const stats = `
  <div class="pg-stats">
    <div class="pg-stat s-total"><div class="v">${src.length}</div><div class="l">Total</div><div class="sub">${PKR(src.reduce((s,e)=>s+(e.amount||0),0))}</div></div>
    <div class="pg-stat s-pending"><div class="v" style="color:var(--yellow)">${src.filter(e=>e.status==='pending').length}</div><div class="l">Pending</div><div class="sub">${PKR(src.filter(e=>e.status==='pending').reduce((s,e)=>s+(e.amount||0),0))}</div></div>
    <div class="pg-stat s-verified"><div class="v" style="color:var(--blue)">${src.filter(e=>e.status==='verified').length}</div><div class="l">Verified</div><div class="sub">${PKR(src.filter(e=>e.status==='verified').reduce((s,e)=>s+(e.amount||0),0))}</div></div>
    <div class="pg-stat s-posted"><div class="v" style="color:var(--green)">${src.filter(e=>e.journaled).length}</div><div class="l">Posted</div><div class="sub">${PKR(src.filter(e=>e.journaled).reduce((s,e)=>s+(e.amount||0),0))}</div></div>
    <div class="pg-stat s-rejected"><div class="v" style="color:var(--red)">${src.filter(e=>e.status==='rejected').length}</div><div class="l">Rejected</div><div class="sub">Today: ${src.filter(e=>(e.created_at||'').slice(0,10)===today).length}</div></div>
  </div>`;

  const fieldTabs=`
  <div class="pg-tabs">
    ${canDo('paygate.submit')?`<div class="pg-tab ${pgTab==='submit'?'active':''}" onclick="switchTab('submit')">+ Submit Payment</div>`:''}
    <div class="pg-tab ${pgTab==='history'?'active':''}" onclick="switchTab('history')">📋 My History</div>
    <div class="pg-tab ${pgTab==='monthly'?'active':''}" onclick="switchTab('monthly')">📅 Monthly</div>
  </div>`;

  const adminTabs=`
  <div class="pg-tabs">
    <div class="pg-tab ${pgTab==='all'?'active':''}" onclick="switchTab('all')">📋 All Payments</div>
    <div class="pg-tab ${pgTab==='review'?'active':''}" onclick="switchTab('review')">⏳ Review Queue</div>
    <div class="pg-tab ${pgTab==='sp'?'active':''}" onclick="switchTab('sp')">👤 By Salesperson</div>
    <div class="pg-tab ${pgTab==='bank'?'active':''}" onclick="switchTab('bank')">🏦 By Bank</div>
    <div class="pg-tab ${pgTab==='monthly'?'active':''}" onclick="switchTab('monthly')">📅 Monthly</div>
    <div class="pg-tab ${pgTab==='client'?'active':''}" onclick="switchTab('client')">👥 By Client</div>
  </div>`;

  let body='';
  if(pgTab==='submit')  body=renderSubmit();
  if(pgTab==='history') body=renderHistory();
  if(pgTab==='monthly') body=renderMonthly(src);
  if(pgTab==='all')     body=renderAll();
  if(pgTab==='review')  body=renderReview();
  if(pgTab==='sp')      body=renderBySP();
  if(pgTab==='bank')    body=renderByBank();
  if(pgTab==='client')  body=renderByClient();

  document.getElementById('pgContent').innerHTML = stats+(isAdmin?adminTabs:fieldTabs)+body;
  bindAc();
  if(pgTab==='submit') bindSubmitListeners();
}

function switchTab(t){ pgTab=t; render(); }

// ── Submit Form ───────────────────────────────────────────────
function renderSubmit(){
  const today=new Date().toISOString().slice(0,10);
  const _q=pgState.cust;
  const sugg=_q.length>1?allClients.filter(c=>c.name.toLowerCase().includes(_q.toLowerCase())).slice(0,8):[];

  return `
  <div class="card card-body" style="max-width:640px">
    <div style="font-size:15px;font-weight:700;margin-bottom:16px">💰 New Payment</div>
    <div class="form-2col">

      <div class="field full">
        <label>Customer / Client Name <span style="color:var(--brand)">*</span></label>
        <div class="ac-wrap">
          <input class="input" id="pg-cust" value="${esc(pgState.cust)}"
            placeholder="Type client name ya naya naam..."
            autocomplete="off" autocorrect="off" autocapitalize="off"
            style="font-size:16px"/>
          <div class="ac-drop hidden" id="acDrop" style="max-height:260px;overflow-y:auto"></div>
        </div>
        <div id="pg-cust-hint" style="font-size:11px;color:var(--text-3);margin-top:4px;display:none"></div>
      </div>

      <div class="field">
        <label>Amount (PKR) <span style="color:var(--brand)">*</span></label>
        <input class="input" id="pg-amt" type="number" value="${pgState.amt||''}" placeholder="0" style="font-size:20px;font-weight:700;text-align:center;font-family:var(--font-mono)" oninput="pgState.amt=this.value"/>
      </div>
      <div class="field">
        <label>Payment Date <span style="color:var(--brand)">*</span></label>
        <input class="input" id="pg-date" type="date" value="${pgState.payDate||today}" oninput="pgState.payDate=this.value"/>
      </div>

      <div class="field full">
        <label>Entity</label>
        <div class="entity-row">
          ${['CNC','CST','CSPL'].map(e=>`<div class="ent-btn ${pgState.ent===e?'sel':''}" onclick="pgState.ent='${e}';render()">${e}</div>`).join('')}
        </div>
      </div>

      <div class="bank-hint full">🏦 Bank for <b>${pgState.ent}</b>: ${BANK_ROUTING[pgState.ent]}</div>

      <div class="field">
        <label>Bank Name <span style="color:var(--brand)">*</span></label>
        <select class="input" id="pg-bank" onchange="pgState.bank=this.value">
          <option value="">Select bank...</option>
          ${BANKS.map(b=>`<option value="${b}" ${pgState.bank===b?'selected':''}>${b}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Account / Ref No.</label>
        <input class="input" id="pg-account" value="${esc(pgState.account)}" placeholder="Account number" style="font-family:var(--font-mono)" oninput="pgState.account=this.value"/>
      </div>

      <div class="field">
        <label>Transaction ID</label>
        <input class="input" id="pg-txn" value="${esc(pgState.txnId)}" placeholder="Bank TXN reference" style="font-family:var(--font-mono)" oninput="pgState.txnId=this.value"/>
      </div>
      <div class="field">
        <label>Client Phone <span style="color:var(--brand)">*</span></label>
        <input class="input" id="pg-phone" type="tel" value="${esc(pgState.phone)}" placeholder="03XX-XXXXXXX" oninput="pgState.phone=this.value;checkSubmit()" style="${!pgState.phone?'border-color:var(--yellow)':''}"/>
        ${!pgState.phone?'<div style="font-size:11px;color:var(--yellow);margin-top:3px">⚠️ Phone number mandatory hai</div>':''}
      </div>

      <div class="field full">
        <label>Payment Type <span style="color:var(--brand)">*</span></label>
        <div class="type-row">
          ${PAY_TYPES.map(t=>`<div class="type-btn ${pgState.typ===t?'sel':''}" onclick="pgState.typ='${t}';render()">${t}</div>`).join('')}
        </div>
      </div>

      ${pgState.typ==='For Dispatch'||pgState.typ==='New Client'?`
      <div class="field full">
        <label>Invoice / Order Ref <span style="color:var(--brand)">*</span></label>
        <input class="input" id="pg-invoice" value="${esc(pgState.invoice)}" placeholder="INV-XXXX or order ref" oninput="pgState.invoice=this.value"/>
      </div>`:''}

      <div class="field full">
        <label>Receipt Photo <span style="color:var(--brand)">*</span> <span style="font-size:11px;color:var(--text-3)">(AI se auto-verify hoga)</span></label>
        <div class="photo-zone" onclick="document.getElementById('pg-photo-input').click()">
          <input type="file" id="pg-photo-input" accept="image/*" style="display:none" onchange="handlePhoto(event)"/>
          ${pgState.photo
            ?`<img src="${pgState.photo}"/>`
            :`<div style="font-size:28px">📸</div><div style="font-size:12px;color:var(--text-3);margin-top:4px">Tap to attach receipt photo — AI automatically verify karega</div>`}
        </div>
        <div id="pg-analysis-result" style="margin-top:8px;display:none"></div>
      </div>

      <div class="field full">
        <label>Note (optional)</label>
        <input class="input" id="pg-note" value="${esc(pgState.note)}" placeholder="Any additional info..." oninput="pgState.note=this.value"/>
      </div>
    </div>

    <div style="margin-top:16px;padding:12px;background:var(--surface-2);border-radius:8px;font-size:12px;color:var(--text-3);margin-bottom:14px">
      ✅ <b>Required:</b> Customer, Amount, Date, Bank Name, Payment Type
    </div>

    <button class="submit-btn" id="pg-submit-btn" onclick="submitPayment()" ${pgState.cust&&pgState.amt&&pgState.bank&&pgState.phone?'':'disabled'}>
      💰 Submit Payment
    </button>
  </div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function bindSubmitListeners(){
  // Attach autocomplete to input — no render() call, only update dropdown
  const inp = document.getElementById('pg-cust');
  if(!inp) return;

  inp.addEventListener('input', function(){
    pgState.cust = this.value;
    updateAcDropdown(this.value);
    checkSubmit();
  });

  inp.addEventListener('focus', function(){
    updateAcDropdown(this.value);
  });

  inp.addEventListener('blur', function(){
    setTimeout(()=>{
      const drop = document.getElementById('acDrop');
      if(drop) drop.classList.add('hidden');
    }, 300);
  });

  // Amount input
  document.getElementById('pg-amt')?.addEventListener('input', function(){
    pgState.amt = this.value; checkSubmit();
  });
  document.getElementById('pg-phone')?.addEventListener('input', function(){
    pgState.phone = this.value; checkSubmit();
  });
}

function updateAcDropdown(q){
  const drop = document.getElementById('acDrop');
  const hint = document.getElementById('pg-cust-hint');
  if(!drop) return;

  if(!q || q.length < 2){
    drop.classList.add('hidden');
    if(hint) hint.style.display='none';
    return;
  }

  const results = allClients.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).slice(0,8);

  if(results.length === 0){
    drop.classList.add('hidden');
    if(hint){
      hint.style.display='block';
      hint.textContent='✏️ Naya naam: "'+q+'"';
    }
    return;
  }

  if(hint) hint.style.display='none';
  drop.classList.remove('hidden');
  drop.innerHTML = results.map(c=>`
    <div class="ac-item" data-name="${c.name.replace(/"/g,'&quot;')}">

function handlePhoto(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    pgState.photo=ev.target.result;
    pgState.analysisResult=null;
    render();
    // Auto-analyze after render
    setTimeout(()=>analyzeScreenshot(ev.target.result, file.type||'image/jpeg'), 300);
  };
  reader.readAsDataURL(file);
}

async function analyzeScreenshot(dataUrl, mimeType) {
  const resultEl = document.getElementById('pg-analysis-result');
  if(!resultEl) return;

  // Get Claude API key from settings
  let claudeKey = '';
  try { claudeKey = JSON.parse(localStorage.getItem('cnc_ai_settings')||'{}').claudeKey||''; } catch(e){}

  if(!claudeKey) {
    // Silently skip - salesperson doesn't need to know about API settings
    resultEl.style.display='none';
    return;
  }

  resultEl.style.display='block';
  resultEl.innerHTML=`<div style="padding:10px;background:var(--surface-2);border-radius:8px;font-size:12px;color:var(--text-3)">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:16px;height:16px;border:2px solid var(--brand);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite"></div>
      🤖 AI screenshot analyze kar raha hai...
    </div>
  </div>`;

  try {
    // Extract base64 data (remove data:image/xxx;base64, prefix)
    const base64 = dataUrl.split(',')[1];
    const amt = parseFloat(document.getElementById('pg-amt')?.value)||0;

    const r = await fetch('https://cnc-erp.vercel.app/api/analyze-screenshot', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-claude-key':claudeKey},
      body:JSON.stringify({
        image_base64: base64,
        image_type: mimeType,
        customer_name: pgState.cust,
        submitted_amount: amt
      })
    });
    const data = await r.json();

    if(!data.success) {
      resultEl.innerHTML=`<div style="padding:10px;background:var(--red-50);border:1px solid var(--red-100);border-radius:8px;font-size:12px;color:var(--red)">
        ❌ Analysis failed: ${data.error||'Unknown error'}
      </div>`;
      return;
    }

    pgState.analysisResult = data;

    const decisionColor = data.auto_approve?'var(--green)':data.decision==='partial_match'?'var(--yellow)':'var(--red)';
    const decisionIcon = data.auto_approve?'✅':data.decision==='partial_match'?'⚠️':'❓';
    const ext = data.extracted||{};

    resultEl.innerHTML=`
    <div style="background:${data.auto_approve?'var(--green-50)':data.decision==='partial_match'?'var(--yellow-50)':'var(--surface-2)'};border:1px solid ${data.auto_approve?'var(--green-100)':data.decision==='partial_match'?'var(--yellow-100)':'var(--border)'};border-radius:8px;padding:12px">
      <div style="font-weight:700;color:${decisionColor};margin-bottom:8px;font-size:13px">${decisionIcon} ${data.auto_approve?'Auto-Approved! Bank SMS match mila':'Manual Review Needed'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;margin-bottom:8px">
        ${ext.amount?`<div><span style="color:var(--text-3)">Amount: </span><b>PKR ${ext.amount?.toLocaleString()}</b></div>`:''}
        ${ext.bank?`<div><span style="color:var(--text-3)">Bank: </span><b>${ext.bank}</b></div>`:''}
        ${ext.sender?`<div><span style="color:var(--text-3)">Sender: </span><b>${ext.sender}</b></div>`:''}
        ${ext.date?`<div><span style="color:var(--text-3)">Date: </span><b>${ext.date}</b></div>`:''}
        ${ext.txn_id?`<div style="grid-column:1/-1"><span style="color:var(--text-3)">TXN: </span><b style="font-family:monospace">${ext.txn_id}</b></div>`:''}
      </div>
      ${data.bank_match?`<div style="background:var(--green-50);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--green)">🏦 Bank SMS Match: PKR ${data.bank_match.amount?.toLocaleString()} · ${data.bank_match.bank_name||'Bank'} · Score: ${data.bank_match.match_score}%</div>`:''}
      <div style="margin-top:8px">${(data.decision_reasons||[]).map(r=>`<div style="font-size:11px">${r}</div>`).join('')}</div>
    </div>`;

    // Auto-fill fields from screenshot
    if(ext.amount && !document.getElementById('pg-amt')?.value) {
      pgState.amt = ext.amount; render();
    }
    if(ext.bank && !pgState.bank) {
      pgState.bank = ext.bank; render();
    }

  } catch(err) {
    resultEl.innerHTML=`<div style="padding:10px;background:var(--red-50);border-radius:8px;font-size:12px;color:var(--red)">❌ ${err.message}</div>`;
  }
}

async function submitPayment(){
  const btn=document.getElementById('pg-submit-btn');
  if(!pgState.cust||!pgState.amt||!pgState.bank){return;}
  btn.disabled=true;btn.textContent='Submitting...';

  // Check AI analysis result for auto-approve
  const analysis = pgState.analysisResult;
  const autoApprove = analysis?.auto_approve === true;
  const bankMatchId = analysis?.bank_match?.id || '';

  const entry={
    id:'PG-'+Date.now(),
    customer:pgState.cust,
    amount:parseFloat(pgState.amt)||0,
    entity:pgState.ent,
    payment_type:pgState.typ,
    bank_name:pgState.bank || analysis?.extracted?.bank || '',
    account_number:pgState.account || analysis?.extracted?.account_last4 || '',
    transaction_id:pgState.txnId || analysis?.extracted?.txn_id || '',
    payment_date:pgState.payDate || analysis?.extracted?.date || new Date().toISOString().slice(0,10),
    phone:pgState.phone,
    invoice_ref:pgState.invoice,
    bank_message:pgState.bankmsg,
    photo_url:pgState.photo||'',
    note:pgState.note,
    submitted_by:PGU.name,
    submitted_by_role:PGU.role,
    salesperson_id:PGU.id,
    status: autoApprove ? 'verified' : 'pending',
    verified_by: autoApprove ? 'AI Screenshot Analysis' : '',
    verified_at: autoApprove ? new Date().toISOString() : null,
    journaled:false,
    created_at:new Date().toISOString()
  };

  // Clean null fields
  Object.keys(entry).forEach(k => { if(entry[k]===null||entry[k]==='') delete entry[k]; });

  try{
    await fetch(`${API}/paygate_entries`,{method:'POST',headers:{...HDR,'Prefer':'return=minimal'},body:JSON.stringify(entry)});

    // If auto-approved, also update matching bank alert
    if(autoApprove && bankMatchId){
      await fetch(`${API}/bank_alerts?id=eq.${bankMatchId}`,{
        method:'PATCH', headers:{...HDR,'Prefer':'return=minimal'},
        body:JSON.stringify({match_status:'verified',verified_by:'PayGate AI Match',verified_at:new Date().toISOString()})
      });
    }

    showToast(autoApprove?'✅ Payment submitted & Auto-Approved!':'Payment submitted!', autoApprove?'✅':'✅');
    pgState={cust:'',amt:'',ent:'CNC',typ:'Ledger Client',bank:'',account:'',txnId:'',payDate:'',phone:'',invoice:'',bankmsg:'',note:'',photo:null};
    await loadData();
    pgTab='history';
    render();
  }catch(e){
    showToast('Failed: '+e.message,'❌');
    btn.disabled=false;btn.textContent='💰 Submit Payment';
  }
}

// ── Monthly View ──────────────────────────────────────────────
function renderMonthly(src){
  const byMonth={};
  src.forEach(e=>{
    const m=(e.payment_date||e.created_at||'').slice(0,7);
    if(!m)return;
    if(!byMonth[m])byMonth[m]={count:0,amount:0,posted:0,pending:0,rejected:0};
    byMonth[m].count++;
    byMonth[m].amount+=(e.amount||0);
    if(e.journaled)byMonth[m].posted++;
    else if(e.status==='rejected')byMonth[m].rejected++;
    else byMonth[m].pending++;
  });

  const months=Object.keys(byMonth).sort().reverse().slice(0,12);
  const maxAmt=Math.max(...months.map(m=>byMonth[m].amount),1);

  const bars=months.slice().reverse().map(m=>{
    const d=byMonth[m];
    const h=Math.max(4,Math.round((d.amount/maxAmt)*55));
    const label=new Date(m+'-01').toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
    return `<div class="bar-wrap" title="${label}: ${PKR(d.amount)}">
      <div class="bar" style="height:${h}px;background:var(--brand)"></div>
      <div class="bar-lbl">${label}</div>
    </div>`;
  }).join('');

  const rows=months.map(m=>{
    const d=byMonth[m];
    const label=new Date(m+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    return `<tr>
      <td style="font-weight:600">${label}</td>
      <td class="num">${d.count}</td>
      <td class="num strong">${PKR(d.amount)}</td>
      <td class="num" style="color:var(--green)">${d.posted}</td>
      <td class="num" style="color:var(--yellow)">${d.pending}</td>
      <td class="num" style="color:var(--red)">${d.rejected}</td>
    </tr>`;
  }).join('');

  return `
  <div class="report-card">
    <div class="report-hdr"><h3>📅 Monthly Trend</h3></div>
    <div style="padding:16px">
      <div class="mini-chart">${bars}</div>
    </div>
  </div>
  <div class="report-card">
    <div class="report-hdr">
      <h3>Monthly Breakdown</h3>
      <button class="btn btn-secondary btn-sm" onclick="exportMonthly(${JSON.stringify(Object.fromEntries(months.map(m=>[m,byMonth[m]])))})">📥 Export</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Month</th><th class="num">Count</th><th class="num">Total Amount</th><th class="num">Posted</th><th class="num">Pending</th><th class="num">Rejected</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="6"><div class="empty"><div class="empty-title">No data</div></div></td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

  return `
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button class="btn btn-secondary btn-sm" onclick="exportSP(${JSON.stringify(Object.fromEntries(Object.entries(grp).map(([k,v])=>[k,{...v,banks:[...v.banks]}])))})">📥 Export</button>
  </div>
  <div class="report-card">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Sales Person</th><th class="num">Payments</th><th class="num">Total Amount</th><th class="num">Posted</th><th class="num">Pending</th><th class="num">Rejected</th><th>Banks Used</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="7"><div class="empty"><div class="empty-title">No data</div></div></td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

// ── By Bank ───────────────────────────────────────────────────
function renderByBank(){
  const grp={};
  allEntries.forEach(e=>{
    const b=e.bank_name||'Unknown';
    if(!grp[b])grp[b]={count:0,amount:0,accounts:new Set(),entities:{CNC:0,CST:0,CSPL:0}};
    grp[b].count++;
    grp[b].amount+=(e.amount||0);
    if(e.account_number)grp[b].accounts.add(e.account_number);
    if(e.entity)grp[b].entities[e.entity]=(grp[b].entities[e.entity]||0)+1;
  });

  const rows=Object.entries(grp).sort((a,b)=>b[1].amount-a[1].amount).map(([bank,d])=>`
  <tr>
    <td style="font-weight:600">${bank}</td>
    <td class="num">${d.count}</td>
    <td class="num strong">${PKR(d.amount)}</td>
    <td style="font-size:11px;color:var(--text-3)">${[...d.accounts].slice(0,3).join(', ')}</td>
    <td style="font-size:11px">
      ${d.entities.CNC?`<span class="badge badge-red">CNC: ${d.entities.CNC}</span> `:''}
      ${d.entities.CST?`<span class="badge badge-blue">CST: ${d.entities.CST}</span> `:''}
      ${d.entities.CSPL?`<span class="badge badge-green">CSPL: ${d.entities.CSPL}</span>`:''}
    </td>
  </tr>`).join('');

  return `
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button class="btn btn-secondary btn-sm" onclick="exportBank()">📥 Export</button>
  </div>
  <div class="report-card">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Bank</th><th class="num">Payments</th><th class="num">Total Amount</th><th>Accounts Used</th><th>Entities</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5"><div class="empty"><div class="empty-title">No data</div></div></td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

// ── By Client ─────────────────────────────────────────────────
function renderByClient(){
  const q=document.getElementById('cl-q')?.value?.toLowerCase()||'';
  const grp={};
  allEntries.forEach(e=>{
    const c=e.customer||'Unknown';
    if(!grp[c])grp[c]={count:0,amount:0,last:e.created_at,posted:0,pending:0};
    grp[c].count++;
    grp[c].amount+=(e.amount||0);
    if((e.created_at||'')>(grp[c].last||''))grp[c].last=e.created_at;
    if(e.journaled)grp[c].posted++;
    else grp[c].pending++;
  });

  let entries=Object.entries(grp).sort((a,b)=>b[1].amount-a[1].amount);
  if(q)entries=entries.filter(([c])=>c.toLowerCase().includes(q));

  return `
  <div class="filter-bar">
    <input class="input" style="width:240px" id="cl-q" placeholder="Search client..." value="${q}" oninput="render()"/>
    <span style="font-size:12px;color:var(--text-3)">${entries.length} clients</span>
    <button class="btn btn-secondary btn-sm" onclick="exportClient()">📥 Export</button>
  </div>
  <div class="report-card">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Client</th><th class="num">Payments</th><th class="num">Total Amount</th><th class="num">Posted</th><th class="num">Pending</th><th>Last Payment</th></tr></thead>
        <tbody>${entries.slice(0,200).map(([c,d])=>`
        <tr>
          <td style="font-weight:600">${esc(c)}</td>
          <td class="num">${d.count}</td>
          <td class="num strong">${PKR(d.amount)}</td>
          <td class="num" style="color:var(--green)">${d.posted}</td>
          <td class="num" style="color:var(--yellow)">${d.pending}</td>
          <td style="font-size:11px;color:var(--text-3)">${fmtDate(d.last)}</td>
        </tr>`).join('')||'<tr><td colspan="6"><div class="empty"><div class="empty-title">No data</div></div></td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── Actions ───────────────────────────────────────────────────
async function verifyEntry(id){
  await fetch(`${API}/paygate_entries?id=eq.${id}`,{method:'PATCH',headers:{...HDR,'Prefer':'return=minimal'},body:JSON.stringify({status:'verified',verified_by:PGU.name,verified_at:new Date().toISOString()})});
  showToast('Payment verified','✅');
  await loadData(); render();
}
async function rejectEntry(id){
  const reason=prompt('Rejection reason:');
  if(reason===null)return;
  await fetch(`${API}/paygate_entries?id=eq.${id}`,{method:'PATCH',headers:{...HDR,'Prefer':'return=minimal'},body:JSON.stringify({status:'rejected',rejection_reason:reason,verified_by:PGU.name,verified_at:new Date().toISOString()})});
  showToast('Payment rejected','❌');
  await loadData(); render();
}
async function postJournal(id){
  if(!confirm('Post to journal? This marks it as final.'))return;
  await fetch(`${API}/paygate_entries?id=eq.${id}`,{method:'PATCH',headers:{...HDR,'Prefer':'return=minimal'},body:JSON.stringify({journaled:true,status:'posted',journaled_by:PGU.name,journaled_at:new Date().toISOString()})});
  showToast('Posted to journal','📒');
  await loadData(); render();
}
async function deleteEntry(id){
  if(!confirm('Delete this payment entry? Cannot undo.'))return;
  await fetch(`${API}/paygate_entries?id=eq.${id}`,{method:'DELETE',headers:HDR});
  showToast('Deleted','🗑️');
  await loadData(); render();
}

// ── Detail Modal ──────────────────────────────────────────────
function showDetail(id){
  const e=allEntries.find(x=>x.id===id);if(!e)return;
  const st=e.journaled?'posted':e.status||'pending';
  const stTxt={pending:'⏳ Pending',verified:'✅ Verified',posted:'📒 Posted',rejected:'❌ Rejected'};
  const stColor={pending:'var(--yellow)',verified:'var(--blue)',posted:'var(--green)',rejected:'var(--red)'};

  document.getElementById('pgDetailContent').innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
    <div>
      <div style="font-size:18px;font-weight:800">${esc(e.customer)}</div>
      <div style="font-size:12px;color:var(--text-3)">Submitted by ${e.submitted_by||'—'} · ${fmtDT(e.created_at)}</div>
    </div>
    <button onclick="closeDetail()" style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:18px">✕</button>
  </div>

  <div style="font-size:32px;font-weight:800;margin-bottom:8px">${PKR(e.amount)}</div>

  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
    <span class="badge badge-${e.entity==='CNC'?'red':e.entity==='CST'?'blue':'green'}">${e.entity}</span>
    <span class="badge badge-gray">${e.payment_type||'—'}</span>
    <span class="status-pill ${st}">${stTxt[st]||st}</span>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
    <div style="background:var(--surface-2);padding:10px;border-radius:8px">
      <div style="font-size:10px;color:var(--text-3);text-transform:uppercase;margin-bottom:4px">Bank</div>
      <div style="font-weight:600">${e.bank_name||'—'}</div>
      ${e.account_number?`<div style="font-size:11px;font-family:var(--font-mono);color:var(--text-3)">${e.account_number}</div>`:''}
    </div>
    <div style="background:var(--surface-2);padding:10px;border-radius:8px">
      <div style="font-size:10px;color:var(--text-3);text-transform:uppercase;margin-bottom:4px">Payment Date</div>
      <div style="font-weight:600">${fmtDate(e.payment_date||e.created_at)}</div>
      ${e.transaction_id?`<div style="font-size:11px;font-family:var(--font-mono);color:var(--text-3)">TXN: ${e.transaction_id}</div>`:''}
    </div>
  </div>

  ${e.rejection_reason?`<div style="padding:10px;background:var(--red-50);border:1px solid var(--red-100);border-radius:8px;font-size:12px;color:var(--red);margin-bottom:12px"><b>Rejection reason:</b> ${esc(e.rejection_reason)}</div>`:''}
  ${e.phone?`<div style="margin-bottom:6px;font-size:13px">📱 ${e.phone}</div>`:''}
  ${e.invoice_ref?`<div style="margin-bottom:6px;font-size:13px">📄 Invoice: ${e.invoice_ref}</div>`:''}
  ${e.note?`<div style="margin-bottom:6px;font-size:13px">📝 ${esc(e.note)}</div>`:''}
  ${e.verified_by?`<div style="font-size:11px;color:var(--text-3);margin-bottom:4px">Verified by: ${e.verified_by} · ${fmtDT(e.verified_at)}</div>`:''}
  ${e.journaled_by?`<div style="font-size:11px;color:var(--text-3);margin-bottom:4px">Posted by: ${e.journaled_by} · ${fmtDT(e.journaled_at)}</div>`:''}
  ${e.photo_url?`<img src="${e.photo_url}" style="max-width:100%;border-radius:8px;margin:10px 0;max-height:280px;object-fit:cover;cursor:pointer" onclick="window.open(this.src)"/>`:''}
  ${e.bank_message?`<div style="padding:10px;background:var(--surface-2);border-radius:8px;font-size:11px;font-family:var(--font-mono);line-height:1.6;margin-top:8px">${esc(e.bank_message)}</div>`:''}

  ${st==='pending'&&canDo('paygate.verify')?`
  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
    <button class="btn btn-success" onclick="verifyEntry('${e.id}');closeDetail()">✅ Verify</button>
    <button class="btn btn-danger" onclick="rejectEntry('${e.id}');closeDetail()">❌ Reject</button>
    ${canDo('paygate.journal')?`<button class="btn btn-primary" onclick="postJournal('${e.id}');closeDetail()">📒 Post Journal</button>`:''}
  </div>`:''}
  ${st==='verified'&&canDo('paygate.journal')?`
  <div style="margin-top:16px">
    <button class="btn btn-primary" onclick="postJournal('${e.id}');closeDetail()">📒 Post to Journal</button>
  </div>`:''}
  `;
  document.getElementById('pgDetailModal').classList.remove('hidden');
}

function closeDetail(){document.getElementById('pgDetailModal').classList.add('hidden');}
document.getElementById('pgDetailModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail();});

// ── Exports ───────────────────────────────────────────────────
function toCSV(headers,rows){
  return [headers.join(','),...rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','))].join('\n');
}
function downloadCSV(csv,name){
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=name+'_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

function exportPayments(src){
  if(!src?.length){showToast('No data','⚠️');return;}
  const csv=toCSV(
    ['ID','Customer','Amount','Bank','Account','TXN ID','Payment Date','Entity','Type','Status','Submitted By','Verified By','Note','Created At'],
    src.map(e=>[e.id,e.customer,e.amount,e.bank_name,e.account_number,e.transaction_id,e.payment_date||e.created_at?.slice(0,10),e.entity,e.payment_type,e.journaled?'Posted':e.status,e.submitted_by,e.verified_by,e.note,e.created_at?.slice(0,10)])
  );
  downloadCSV(csv,'PayGate_Payments');
  showToast(src.length+' records exported','📥');
}

function exportMonthly(data){
  const csv=toCSV(['Month','Count','Total Amount','Posted','Pending','Rejected'],
    Object.entries(data).map(([m,d])=>[m,d.count,d.amount,d.posted,d.pending,d.rejected]));
  downloadCSV(csv,'PayGate_Monthly');
}

function exportSP(data){
  const csv=toCSV(['Salesperson','Count','Total Amount','Posted','Pending','Rejected','Banks'],
    Object.entries(data).map(([sp,d])=>[sp,d.count,d.amount,d.posted,d.pending,d.rejected,(d.banks||[]).join('; ')]));
  downloadCSV(csv,'PayGate_BySalesperson');
}

function exportBank(){
  exportPayments(allEntries);
}

function exportClient(){
  const grp={};
  allEntries.forEach(e=>{
    const c=e.customer||'Unknown';
    if(!grp[c])grp[c]={count:0,amount:0,last:e.created_at,posted:0,pending:0};
    grp[c].count++;grp[c].amount+=(e.amount||0);
    if((e.created_at||'')>(grp[c].last||''))grp[c].last=e.created_at;
    if(e.journaled)grp[c].posted++;else grp[c].pending++;
  });
  const csv=toCSV(['Client','Count','Total Amount','Posted','Pending','Last Payment'],
    Object.entries(grp).sort((a,b)=>b[1].amount-a[1].amount).map(([c,d])=>[c,d.count,d.amount,d.posted,d.pending,fmtDate(d.last)]));
  downloadCSV(csv,'PayGate_ByClient');
}
</script>
