<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payments · CNC Electric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
.payment-row {
  display: grid;
  grid-template-columns: 60px 1.2fr 1.2fr 1fr 1fr 1fr 100px;
  gap: 12px; align-items: center;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.payment-row:hover { background: var(--surface-2); }
.payment-row:last-child { border-bottom: none; }
.payment-thumb {
  width: 48px; height: 48px;
  background: var(--surface-2);
  border-radius: 6px;
  display: grid; place-items: center;
  font-size: 18px; color: var(--text-3);
  cursor: pointer; overflow: hidden;
  border: 1px solid var(--border);
}
.payment-thumb img { width: 100%; height: 100%; object-fit: cover; }
.payment-thumb:hover { background: var(--surface-3); }
.payment-header-row {
  display: grid;
  grid-template-columns: 60px 1.2fr 1.2fr 1fr 1fr 1fr 100px;
  gap: 12px;
  padding: 10px 16px;
  background: var(--surface-2);
  font-size: 11px; font-weight: 600; color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
}
@media (max-width: 800px) {
  .payment-row, .payment-header-row { grid-template-columns: 50px 1fr; }
}
</style>
</head>
<body data-page="payments">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">💳 Payment Records</div>
        <div class="topbar-sub">All payment screenshots from sales team — extracted by bot</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="exportPayments()">📥 Export</button>
        <a class="btn btn-primary btn-sm" href="upload.html">+ Load Data</a>
      </div>
    </div>

    <div class="content">

      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">Total Payments</div><div class="kpi-value" id="pm-total">0</div></div>
        <div class="kpi-card green"><div class="kpi-label">Total Received</div><div class="kpi-value" id="pm-amount">PKR 0</div></div>
        <div class="kpi-card blue"><div class="kpi-label">This Month</div><div class="kpi-value" id="pm-month">PKR 0</div></div>
        <div class="kpi-card"><div class="kpi-label">This Week</div><div class="kpi-value" id="pm-week">PKR 0</div></div>
      </div>

      <div class="toolbar">
        <div class="toolbar-search">
          <input class="search-input" id="paymentSearch" placeholder="Search by client, sales rep, amount, ref..." oninput="renderPayments()"/>
        </div>
        <select class="select" style="width:auto;min-width:140px" id="paymentSP" onchange="renderPayments()">
          <option value="">All Sales Reps</option>
        </select>
        <select class="select" style="width:auto;min-width:140px" id="paymentDate" onchange="renderPayments()">
          <option value="">All Dates</option>
          <option value="today">Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
        </select>
        <select class="select" style="width:auto;min-width:140px" id="paymentStatus" onchange="renderPayments()">
          <option value="">All Status</option>
          <option value="Confirmed">✓ Confirmed</option>
          <option value="Pending">⏳ Pending</option>
          <option value="Disputed">⚠ Disputed</option>
        </select>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Payment Screenshots</div>
          <div style="font-size:12px;color:var(--text-3);font-family:var(--font-mono)" id="paymentCount">0 payments</div>
        </div>
        <div id="paymentsList"></div>
      </div>

    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="shared/firebase-config.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/core.js"></script>
<script>
function renderPayments() {
  const search = (document.getElementById('paymentSearch').value || '').toLowerCase();
  const sp = document.getElementById('paymentSP').value;
  const dateFilter = document.getElementById('paymentDate').value;
  const statusFilter = document.getElementById('paymentStatus').value;

  // Sales rep dropdown
  const spSel = document.getElementById('paymentSP');
  const allSPs = [...new Set(payments.map(p => p.salesPerson).filter(Boolean))].sort();
  const cur = spSel.value;
  spSel.innerHTML = '<option value="">All Sales Reps</option>' +
    allSPs.map(s => `<option value="${s}" ${cur === s ? 'selected' : ''}>${s}</option>`).join('');
  spSel.value = cur;

  // KPIs
  const totalAmount = payments.reduce((s, p) => s + num(p.amount), 0);
  const monthAgo = Date.now() - 30 * 86400000;
  const weekAgo = Date.now() - 7 * 86400000;
  const monthAmt = payments.filter(p => new Date(p.timestamp).getTime() >= monthAgo).reduce((s, p) => s + num(p.amount), 0);
  const weekAmt = payments.filter(p => new Date(p.timestamp).getTime() >= weekAgo).reduce((s, p) => s + num(p.amount), 0);

  document.getElementById('pm-total').textContent = payments.length;
  document.getElementById('pm-amount').textContent = 'PKR ' + fmtK(totalAmount);
  document.getElementById('pm-month').textContent = 'PKR ' + fmtK(monthAmt);
  document.getElementById('pm-week').textContent = 'PKR ' + fmtK(weekAmt);

  // Filter
  let filtered = payments.filter(p => {
    if (search) {
      const haystack = ((p.client || '') + ' ' + (p.salesPerson || '') + ' ' + p.amount + ' ' + (p.refNo || '') + ' ' + (p.bank || '') + ' ' + (p.notes || '')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    if (sp && p.salesPerson !== sp) return false;
    if (statusFilter && p.status !== statusFilter) return false;
    if (dateFilter) {
      const t = new Date(p.timestamp).getTime();
      if (dateFilter === 'today' && t < Date.now() - 86400000) return false;
      if (dateFilter === 'week' && t < weekAgo) return false;
      if (dateFilter === 'month' && t < monthAgo) return false;
    }
    return true;
  });

  filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  document.getElementById('paymentCount').textContent = filtered.length + ' payments';

  const list = document.getElementById('paymentsList');
  if (!filtered.length) {
    if (payments.length === 0) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">💳</div><div class="empty-title">No payments yet</div><div class="empty-desc">When sales reps send payment screenshots in the WhatsApp Payments group, the bot will extract them and show here. Or upload <code style="font-family:var(--font-mono);background:var(--surface-2);padding:1px 6px;border-radius:3px">payments_db.json</code> from <a href="upload.html" style="color:var(--brand)">Load Data</a>.</div></div>`;
    } else {
      list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No matches</div><div class="empty-desc">Try changing your filters</div></div>`;
    }
    return;
  }

  list.innerHTML = `
    <div class="payment-header-row">
      <div></div>
      <div>Client</div>
      <div>Sales Rep</div>
      <div style="text-align:right">Amount</div>
      <div>Method</div>
      <div>Date</div>
      <div>Status</div>
    </div>
    ${filtered.map(p => `
      <div class="payment-row">
        <div class="payment-thumb" onclick="${p.screenshotUrl ? `openImage('${p.screenshotUrl}')` : ''}" title="${p.screenshotUrl ? 'Click to view' : 'No screenshot'}">
          ${p.screenshotUrl ? `<img src="${p.screenshotUrl}" alt=""/>` : '🧾'}
        </div>
        <div>
          <div class="strong">${p.client || '—'}</div>
          <div class="text-3" style="font-size:11px">${p.refNo || p.notes || ''}</div>
        </div>
        <div>
          <div>${p.salesPerson || '—'}</div>
          <div class="text-3" style="font-size:11px">${p.salesPhone || ''}</div>
        </div>
        <div class="num strong" style="text-align:right;font-family:var(--font-mono)">PKR ${fmt(p.amount)}</div>
        <div>
          <div style="font-size:13px">${p.method || '—'}</div>
          <div class="text-3" style="font-size:11px">${p.bank || ''}</div>
        </div>
        <div class="text-3" style="font-size:12px">${fmtDateTime(p.timestamp)}</div>
        <div><span class="badge badge-${p.status === 'Confirmed' ? 'green' : p.status === 'Pending' ? 'yellow' : p.status === 'Disputed' ? 'red' : 'gray'}">${p.status || '—'}</span></div>
      </div>
    `).join('')}
  `;
}

function exportPayments() {
  if (!payments.length) { showToast('No payments to export', '⚠️'); return; }
  const headers = 'ID,Date,Client,Sales Rep,Amount,Method,Bank,Reference,Status,Notes\n';
  const data = payments.map(p =>
    `${p.id || ''},${fmtDateTime(p.timestamp)},"${p.client || ''}","${p.salesPerson || ''}",${p.amount || 0},"${p.method || ''}","${p.bank || ''}","${p.refNo || ''}",${p.status || ''},"${(p.notes || '').replace(/"/g, '""')}"`
  ).join('\n');
  const blob = new Blob([headers + data], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CNC_Payments.csv';
  a.click();
  showToast('Payments exported', '📥');
}

document.addEventListener('DOMContentLoaded', () => {
  renderPayments();
});
</script>
</body>
</html>
